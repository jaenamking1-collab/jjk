<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETF 분배금 공지</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/npm/pretendard/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#f4f7ff; --bg2:#ffffff; --bg3:#eef3ff; --bg4:#e3e9f6;
    --border:#e3ddf3; --text:#1a1330; --text2:#4b5563; --text3:#9ca3af;
    --accent:#5b5bf0; --accent2:#3b82f6; --green:#10b981; --red:#f43f5e; --purple:#a855f7;
    --mono:'Pretendard',sans-serif; --sans:'Pretendard',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:
      radial-gradient(1200px 600px at 8% -8%, #ffe4f2 0%, rgba(255,228,242,0) 55%),
      radial-gradient(1000px 520px at 100% 0%, #dcefff 0%, rgba(220,239,255,0) 50%),
      radial-gradient(900px 700px at 50% 120%, #e6fff6 0%, rgba(230,255,246,0) 55%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text); font-family:var(--sans); min-height:100vh;
    font-feature-settings:"tnum"; font-variant-numeric:tabular-nums;
  }
  header{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 20px; background:linear-gradient(100deg,#fff0f7 0%,#eef1ff 38%,#e6f7ff 68%,#e9fff6 100%);
    border-bottom:1px solid var(--border);
  }
  .logo{font-size:18px; font-weight:800; letter-spacing:-0.3px;
    background:linear-gradient(90deg,#ec4899,#8b5cf6,#3b82f6);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  /* 390px에서 '새로고침'이 '새로고/침'으로 쪼개져 헤더가 81px로 부풀었다(실측) */
  .refresh{background:#fff; border:1px solid #e7e0f5; border-radius:10px; padding:7px 12px;
    font-size:13px; color:var(--text2); cursor:pointer; white-space:nowrap;}
  .refresh:hover{background:var(--bg3);}
  .wrap{padding:16px;}
  .panels{display:flex; gap:14px; align-items:stretch; flex-wrap:wrap; justify-content:center;}
  .panel{border-radius:10px; padding:14px;}
  .p-notice{width:300px; flex-shrink:0; background:#f0fdf4; border:1px solid #dcfce7;}
  .p-cal{flex:0 1 792px; min-width:460px; max-width:792px; background:#f8fafc; border:1px solid #e2e8f0;}
  .p-sched{width:340px; flex-shrink:0; background:#fdf4ff; border:1px solid #f0e2f5;}
  .p-title{font-size:12px; font-weight:700; margin-bottom:8px;}

  /* 세 패널 합이 300+792+340+여백 = 1,504px 이라 그보다 좁은 화면(1280·1366·1440 — 흔한
     노트북 폭)에서 '일정'만 둘째 줄에 홀로 가운데 정렬로 떨어지고 달력 옆이 비었다.
     그 구간에서는 공지+달력을 한 줄, 일정을 그 아래 전체 폭으로 내린다. */
  @media (max-width:1503px) and (min-width:821px){
    .p-sched{width:100%; flex:1 1 100%; max-width:100%;}
    .p-cal{flex:1 1 auto; max-width:none;}
    #distScheduleList table{width:100%;}
  }

  /* ── 탭 메뉴: 한 번에 한 섹션만 보기 ── */
  .tabbar{position:sticky; top:0; z-index:30; display:none; gap:5px; padding:8px 12px; background:var(--bg2); border-bottom:1px solid var(--border);}  /* PC: 숨김(전체 표시). 모바일서만 flex로 표시 */
  .tab-btn{flex:1; min-width:0; padding:9px 4px; border:1px solid var(--border); border-radius:9px; background:#fff; color:var(--text2); font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tab-btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}

  /* ── notice cards ── */
  #noticeGrid{display:flex; flex-direction:column; gap:8px;}
  .notice-card{background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:10px 14px; position:relative; overflow:hidden;}
  .notice-card::before{content:''; position:absolute; top:0; left:0; right:0; height:3px;}
  .notice-card.kodex::before{background:#2563eb;} .notice-card.tiger::before{background:#f97316;}
  .notice-card.ace::before{background:#059669;}   .notice-card.plus::before{background:#7c3aed;}
  .notice-card.rise::before{background:#dc2626;}   .notice-card.sol::before{background:#0891b2;}
  .notice-brand{font-size:11px; font-weight:700; letter-spacing:.5px; margin-bottom:6px; display:flex; align-items:center; gap:6px;}
  .notice-brand.kodex{color:#2563eb;} .notice-brand.tiger{color:#f97316;} .notice-brand.ace{color:#059669;}
  .notice-brand.plus{color:#7c3aed;}  .notice-brand.rise{color:#dc2626;}  .notice-brand.sol{color:#0891b2;}
  .notice-item{padding:4px 0; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .notice-item:last-child{border-bottom:none; padding-bottom:0;}
  .notice-title{font-size:12px; color:var(--text); line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px; cursor:pointer;}
  .notice-title:hover{color:var(--accent2); text-decoration:underline;}
  .notice-date{font-size:11px; color:var(--text3); white-space:nowrap; font-family:var(--mono);}
  .new-badge{display:inline-block; margin-left:4px; padding:0 5px; height:14px; line-height:14px; border-radius:7px; background:#ef4444; color:#fff; font-size:9px; font-weight:800; vertical-align:1px;}
  /* 공지 카드 하단: 공지에 나온 전체 종목 목록 (펼치기/접기) */
  /* ── 하단 공지 종목 전체 그리드 (포트폴리오 앱의 분배 내역 섹션과 동일 레이아웃) ── */
  .dist-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .dist-items{max-height:340px; overflow-y:auto;}
  #distGrid td.dg-name{max-width:160px;}  /* 종목명 열 폭: 데스크톱 기준(모바일은 아래 미디어쿼리에서 축소) */
  .notice-loading{font-size:12px; color:var(--text3); text-align:center; padding:16px 0;}
  .notice-err{font-size:12px; color:#b91c1c; text-align:center; padding:16px 0;}
  .notice-empty{font-size:12px; color:var(--text2); text-align:center; padding:16px 0;}
  /* 회차 상태 한 줄 — 달력 바로 위. 대비 6.9:1(#1e3a8a on #eff6ff) */
  .cal-status{font-size:12px; line-height:1.5; color:#1e3a8a; background:#eff6ff;
    border:1px solid #bfdbfe; border-radius:6px; padding:6px 10px; margin-bottom:8px;}
  .cal-status b{font-weight:800;}
  .spinner{display:inline-block; width:16px; height:16px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .6s linear infinite; vertical-align:middle; margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── 운용사별 일정: 포트폴리오 앱과 동일한 격자 표 ── */
  #distScheduleList table{width:100%; border-collapse:collapse; font-size:11px; border:2px solid #111827; background:var(--bg2);}
  #distScheduleList th{padding:6px 3px; font-size:11px; font-weight:700; color:#111827; background:#e2e8f0; border:1px solid #111827; white-space:nowrap;}
  #distScheduleList td{border:1px solid #64748b; vertical-align:middle;}

  /* ── 달력 셀 ── */
  .cal-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:4px; width:100%;}
  .cal-dow{text-align:center; font-size:13px; font-weight:800; padding:6px 0; color:#fff; background:#4f46e5; border-radius:5px;}
  .cal-cell{padding:5px; border-radius:6px; min-height:95px; display:flex; flex-direction:column;}
  .cal-date{font-size:13px; margin-bottom:2px;}
  .cal-hol{margin-left:3px; font-size:9px; font-weight:700; color:#dc2626; white-space:nowrap;}
  .cal-icons{display:grid; grid-template-columns:repeat(3,1fr); gap:2px;}
  .cal-chip{display:flex; align-items:center; justify-content:center; color:#fff; font-size:9px; font-weight:700; height:15px; border-radius:2px; white-space:nowrap; padding:0 2px;}
  .cal-chip .chip-min{display:none;}
  .cal-evt{margin-top:3px; font-size:11px; font-weight:700; text-align:center; padding:2px 0; border-radius:4px;}
  .cal-evt .lbl-short{display:none;}
  .cal-companies{display:none; flex-wrap:wrap; gap:3px 10px; justify-content:center; margin-bottom:6px; font-size:10px; color:var(--text2);}
  .cal-co{display:flex; align-items:center; gap:3px;}
  .co-chip{display:inline-flex; align-items:center; justify-content:center; padding:0 3px; height:13px; border-radius:2px; color:#fff; font-size:8px; font-weight:700;}

  /* ── mobile: 세로 스택, 달력은 화면 폭에 맞게 축소, 일정 표만 좌우 스크롤 ── */
  @media (max-width:820px){
    .panels{flex-direction:column; align-items:stretch; gap:8px;}
    .dist-grid{grid-template-columns:1fr;}
    .tabbar{display:flex; padding:6px 8px; gap:4px;}
    .tab-btn{font-size:11px; padding:8px 2px;}
    /* 탭: active 섹션만 표시(모바일 전용). PC엔 이 규칙이 없어 전부 보임 */
    .p-notice, .p-cal, .p-sched, #sec-grid{display:none;}
    .p-notice.tab-active, .p-cal.tab-active, .p-sched.tab-active, #sec-grid.tab-active{display:block;}
    /* 종목 카드 자체 스크롤 제거 → 페이지가 자연스럽게 스크롤(카드 안에 갇히지 않게) */
    .dist-items{max-height:none;}
    .panel{padding:10px;}
    /* 세로 스택에선 flex-basis(792px)가 '높이'로 먹혀 빈 공간이 생기므로 flex 해제 → 내용 높이로 */
    .p-notice, .p-cal, .p-sched{width:100%; max-width:100%; min-width:0; flex:none;}
    .cal-companies{display:flex;}
    .cal-scroll, .sched-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
    /* 표를 화면 폭에 맞춰 축소 → 지급 열까지 좌우 스크롤 없이 보이게 */
    #distScheduleList{min-width:0;}
    #distScheduleList table{font-size:10px;}
    #distScheduleList th{padding:5px 2px;}
    /* 공지 종목 표: 390px에서 전달비·✕ 열이 화면 밖으로 64px 밀려 있었다(실측).
       종목명을 줄이는 것만으로는 모자라 '코드' 열을 감춘다 — 종목명이 바로 옆에 있어 잃는 정보가 없다. */
    #distGrid td.dg-name{max-width:92px;}
    #distGrid .dg-code{display:none;}
    .cal-grid{gap:2px;}
    .cal-dow{font-size:11px; padding:4px 0;}
    .cal-cell{padding:3px; min-height:74px; border-radius:5px;}
    .cal-date{font-size:11px;}
    .cal-hol{font-size:8px; margin-left:2px;}
    .cal-icons{gap:1px;}
    .cal-chip{font-size:7px; height:13px; padding:0 1px;}
    .cal-chip .chip-full{display:none;}
    .cal-chip .chip-min{display:inline;}
    .cal-evt{font-size:9px; padding:1px 0;}
    .cal-evt .lbl-full{display:none;}
    .cal-evt .lbl-short{display:inline;}
  }
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:baseline;gap:10px;min-width:0">
    <div class="logo">ETF 분배금 공지</div>
    <span id="visitCount" style="font-size:12px;color:#64748b;font-weight:600;white-space:nowrap"></span>
  </div>
  <button class="refresh" onclick="pageRefresh()">🔄 새로고침</button>
</header>

<div class="tabbar">
  <button class="tab-btn active" data-sec="cal" onclick="showSection('cal')">달력</button>
  <button class="tab-btn" data-sec="notice" onclick="showSection('notice')">분배금공지</button>
  <button class="tab-btn" data-sec="sched" onclick="showSection('sched')">분배일정</button>
  <button class="tab-btn" data-sec="grid" onclick="showSection('grid')">종목전체</button>
</div>

<div class="wrap">
  <div class="panels">
    <div class="panel p-notice">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
        <div class="p-title" id="noticeTitle" style="color:#16a34a;margin-bottom:0">📢 분배금 공지</div>
        <button onclick="noticeShiftMonth(-1)" title="이전 달" style="width:24px;height:24px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;line-height:1">←</button>
        <button onclick="noticeShiftMonth(1)" title="다음 달" style="width:24px;height:24px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;line-height:1">→</button>
      </div>
      <div id="noticeGrid"><div class="notice-loading">불러오는 중...</div></div>
    </div>
    <div class="panel p-cal tab-active">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
        <div class="p-title" style="color:#64748b;margin-bottom:0">📅 분배 일정 달력</div>
        <button onclick="calShiftWeek(-1)" title="한 주 앞으로" style="width:24px;height:24px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;line-height:1">←</button>
        <button onclick="calShiftWeek(1)" title="한 주 뒤로" style="width:24px;height:24px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;line-height:1">→</button>
        <button onclick="calShiftWeek(0)" title="오늘 주로" style="height:24px;padding:0 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;line-height:1">오늘</button>
      </div>
      <div class="cal-scroll">
        <div id="distMasterCalendar"><div style="color:var(--text3);font-size:13px"><span class="spinner"></span>불러오는 중...</div></div>
      </div>
    </div>
    <div class="panel p-sched">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
        <div class="p-title" id="schedTitle" style="color:#a855a8;margin-bottom:0">🏢 운용사별 일정</div>
        <button onclick="schedShiftMonth(-1)" title="이전 달" style="width:24px;height:24px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;line-height:1">←</button>
        <button onclick="schedShiftMonth(1)" title="다음 달" style="width:24px;height:24px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;line-height:1">→</button>
      </div>
      <div class="sched-scroll"><div id="distScheduleList"></div></div>
      <div id="distNoticeBoard"></div>
    </div>
  </div>
  <div id="sec-grid" style="background:#fffbeb;border:1px solid #fef3c7;border-radius:12px;padding:16px;margin-top:14px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <div id="gridTitle" style="font-size:15px;font-weight:700">📋 공지 종목 전체</div>
      <button onclick="gridShiftMonth(-1)" title="이전 달" style="width:24px;height:24px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;line-height:1">←</button>
      <button onclick="gridShiftMonth(1)" title="다음 달" style="width:24px;height:24px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;line-height:1">→</button>
      <button id="hideToggle" onclick="toggleShowHidden()" title="표의 ✕를 누르면 그 종목이 목록에서 빠집니다 (이 브라우저에 저장됩니다)" style="margin-left:auto;padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;line-height:1.4;white-space:nowrap">🙈 숨김</button>
      <button id="favToggle" onclick="toggleFavOnly()" title="★ 표시한 종목만 보기 (이 브라우저에 저장됩니다)" style="padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;line-height:1.4;white-space:nowrap">☆ 관심만</button>
    </div>
    <div id="distGrid"><div style="color:var(--text3);font-size:13px"><span class="spinner"></span>불러오는 중...</div></div>
  </div>
</div>

<script>
// ⚠️ 공개 프록시 GAS의 exec URL 을 여기에 넣는다 (public_dist_proxy.gs 배포 후 발급된 URL).
//    개인 GAS URL 이 아니라 '공개 프록시' URL 이어야 함 — 개인 데이터가 노출되지 않음.
// 앱(portfolio.html)과 같은 배포를 쓴다. 배포가 2개면 한쪽만 갱신돼 값이 어긋나므로 하나로 합침.
const API = 'https://script.google.com/macros/s/AKfycbwJS1Fd-sDCVKPLJEpEWZmPQEKAOR9pG7y-nPKZOYty65j3ArOmlDzNX2WFqiGNF_s/exec';

async function api(params){
  const url = API + '?' + new URLSearchParams(params);
  const res = await fetch(url, { redirect:'follow' });
  return res.json();
}

// 스크래핑해 온 URL은 속성 안에 그대로 넣지 않는다 — 따옴표 하나로 핸들러가 깨지고,
// 공개 페이지라 그 이상도 된다. http(s)가 아니면 링크로 만들지 않는다(javascript: 차단).
const safeUrl = u => /^https?:\/\//i.test(String(u||'')) ? encodeURI(u).replace(/["']/g, c => c === '"' ? '%22' : '%27') : '';
const DIST_SOURCES = [
  { id:'kodex', name:'KODEX', label:'삼성자산운용',   color:'#2563eb' },
  { id:'tiger', name:'TIGER', label:'미래에셋자산운용', color:'#f59e0b' },
  { id:'ace',   name:'ACE',   label:'한국투자신탁운용', color:'#059669' },
  { id:'plus',  name:'PLUS',  label:'한화자산운용',   color:'#7c3aed' },
  { id:'rise',  name:'RISE',  label:'KB자산운용',    color:'#dc2626' },
  { id:'sol',   name:'SOL',   label:'신한자산운용',   color:'#0891b2' }
];
// text: 라벨 글자색. 배경은 color 의 10% 틴트라 같은 색 글자로는 대비가 2:1대로 떨어진다
// (실측 분배락일 1.90:1). 색 코딩은 그대로 두고 글자만 700-shade 로 내려 4.5:1 을 넘긴다.
const SCHED_CFG = [
  { key:'공시일',  color:'#f59e0b', text:'#92400e', label:'분배금공시일', short:'공시일' },
  { key:'분배락일', color:'#22c55e', text:'#166534', label:'분배락일', short:'분배락일' },
  { key:'기준일',  color:'#3b82f6', text:'#1d4ed8', label:'분배금지급기준일', short:'기준일' },
  { key:'지급일',  color:'#ef4444', text:'#b91c1c', label:'분배금지급일', short:'지급일' },
];
// 한국 공휴일(증시 휴장) — 근로자의날 포함. '대체'는 대체공휴일.
// 제헌절은 2026년부터 공휴일로 재지정됨(2026-07-17). 달력은 평일만 그리므로 주말 공휴일은 표시되지 않는다.
const HOLIDAYS = {
  '2026-1-1':'신정',      '2026-2-16':'설날',    '2026-2-17':'설날',   '2026-2-18':'설날',
  '2026-3-2':'삼일절(대체)', '2026-5-1':'근로자의날', '2026-5-5':'어린이날',
  '2026-5-25':'부처님오신날(대체)', '2026-6-3':'지방선거일', '2026-6-6':'현충일',
  '2026-7-17':'제헌절',   '2026-8-17':'광복절(대체)',
  '2026-9-24':'추석',     '2026-9-25':'추석',    '2026-9-26':'추석',
  '2026-10-5':'개천절(대체)', '2026-10-9':'한글날', '2026-12-25':'성탄절',
  '2027-1-1':'신정',      '2027-2-6':'설날',     '2027-2-8':'설날',    '2027-2-9':'설날(대체)',
  '2027-3-1':'삼일절',    '2027-5-5':'어린이날', '2027-5-13':'부처님오신날',
  '2027-6-6':'현충일',    '2027-7-19':'제헌절(대체)', '2027-8-16':'광복절(대체)',
  '2027-9-14':'추석',     '2027-9-15':'추석',    '2027-9-16':'추석',
  '2027-10-4':'개천절(대체)', '2027-10-11':'한글날(대체)', '2027-12-25':'성탄절'
};
// 공개 페이지: 6개 운용사 공지를 모두 프록시(getEtfNotices)로 통일 (브라우저 CORS 없음).
const NOTICE_SOURCES = DIST_SOURCES.map(s => ({
  id: s.id, name: s.name, label: s.label,
  fetch: async () => { const d = await api({ action:'getEtfNotices', source:s.id }); return d.items || []; }
}));

let _distData = [];
let _calWeekOffset = 0;   // 달력 주 단위 이동 (←/→ 버튼)
let _schedMonthOffset = 0; // 운용사별 일정 표: 월 단위 이동 (0=이번 달)
let _gridMonthOffset = 0;  // 공지 종목 전체 그리드: 월 단위 이동 (0=이번 달)

function gridShiftMonth(dir){
  if (!_distData.length) return;
  _gridMonthOffset = Math.max(-1, Math.min(1, _gridMonthOffset + dir));
  renderDistGrid(_distData);
}

// dir: -1 한 주 앞으로, +1 한 주 뒤로, 0 오늘 주로 리셋
function calShiftWeek(dir){
  if (!_distData.length) return;
  _calWeekOffset = dir === 0 ? 0 : Math.max(-26, Math.min(26, _calWeekOffset + dir));
  renderMasterCalendar(_distData);
}

// 운용사별 일정 표의 달 이동. 공지 데이터가 전월~익월 정도만 있어 ±1로 제한.
function schedShiftMonth(dir){
  if (!_distData.length) return;
  _schedMonthOffset = Math.max(-1, Math.min(1, _schedMonthOffset + dir));
  renderMasterCalendar(_distData);
}

async function loadDistributions(force){
  const cal = document.getElementById('distMasterCalendar');
  if (cal) cal.innerHTML = '<div style="color:var(--text3);font-size:13px"><span class="spinner"></span> 불러오는 중...</div>';

  const timeout = ms => new Promise((_,rej) => setTimeout(() => rej(new Error('timeout')), ms));
  // force 재파싱은 OCR(특히 KODEX) 때문에 25초를 넘길 수 있어 여유를 크게 준다
  const fetchOne = (s, ms) => Promise.race([
    api({ action:'getDistribution', source:s.id, force: force?'1':'' }).then(d => ({ ...s, data:d })),
    timeout(ms).then(() => ({ ...s, data:{ items:[], error:'응답 시간 초과' } }))
  ]).catch(e => ({ ...s, data:{ items:[], error:String(e) } }));

  const fillStale = async (pred, ms) => {
    const todo = DIST_SOURCES.filter((s,i) => pred(_distData[i]));
    if (!todo.length) return;
    const r = await Promise.allSettled(todo.map(s => fetchOne(s, ms)));
    r.forEach(x => {
      const v = x.value; if (!v || !(v.data.items||[]).length) return;
      const idx = DIST_SOURCES.findIndex(s => s.id === v.id);
      if (idx >= 0) _distData[idx] = v;
    });
  };

  // 빠른 경로: 6개사를 한 번에 받는다. 서버가 분배캐시 시트를 1회만 읽어서, 개별 호출 6번
  // (=시트 전체 읽기 12회)보다 훨씬 빠르다. force 재파싱은 스크랩이 필요하니 예전 경로를 쓴다.
  // 백엔드 재배포 전이면 getDistributionAll을 몰라 sources가 없으므로 자동으로 예전 경로로 간다.
  // ⚠️ force여도 캐시를 **먼저** 받는다. 예전엔 force면 이 호출을 건너뛰고 곧장 6개사 실시간
  // 스크랩으로 갔는데, Apps Script가 같은 계정 실행을 직렬화해 6개사 합계가 실측 213초다.
  // 그동안 달력이 통째로 '불러오는 중'에 멈춰 있었고, 타임아웃 난 운용사는 빈 값으로 덮였다.
  const bulk = await Promise.race([
    api({ action:'getDistributionAll' }).catch(() => null),
    timeout(25000).catch(() => null)
  ]);

  if (bulk && bulk.sources) {
    _distData = DIST_SOURCES.map(s => ({ ...s, data: bulk.sources[s.id] || { items:[], stale:true } }));
    // 오래된 캐시라도 서버가 마지막 파싱 결과를 실어 보내므로 **먼저 그린다**.
    // 예전엔 아래 fillStale(최대 45초)을 기다린 뒤에야 그려서, 재파싱이 실패하면 그동안 화면이
    // 통째로 백지였다(2026-08-27: 트리거가 멎어 캐시가 17시간 낡자 달력이 빈칸으로 나왔다).
    // portfolio.html의 같은 함수와 쌍이다 — 한쪽을 고치면 반드시 다른 쪽도.
    renderMasterCalendar(_distData);
    renderDistGrid(_distData);
    // force면 6개사 전부 실시간 재파싱, 아니면 캐시가 오래된 곳만.
    // fillStale은 **빈 결과로는 덮지 않으므로** 재파싱이 실패해도 위에서 그린 캐시가 남는다.
    await fillStale(force ? (() => true) : (d => d.data.stale), force ? 90000 : 45000);
  } else {
    const results = await Promise.allSettled(DIST_SOURCES.map(s => fetchOne(s, force ? 90000 : 25000)));
    _distData = results.map(r => r.value || {});
    // 콜드 스크레이핑이 25초를 넘겨 에러로 빈 값이 온 운용사는 한 번 더(긴 타임아웃) 시도.
    // 첫 호출이 서버 캐시를 데워놨으면 즉시, 아직이면 여유 시간 안에 채워진다. 정상 로드엔 안 돈다.
    if (!force) await fillStale(d => d.data && d.data.error && !(d.data.items||[]).length, 45000);
  }
  renderMasterCalendar(_distData);
  renderDistGrid(_distData);
  loadAllNotices();
}

function renderMasterCalendar(allData){
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth() + 1;

  const parseDay = (str) => {
    if (!str) return null;
    const full = str.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
    if (full) return { m: parseInt(full[2]), d: parseInt(full[3]) };
    const ko = str.match(/(\d{1,2})월\s*(\d{1,2})일/);
    if (ko) return { m: parseInt(ko[1]), d: parseInt(ko[2]) };
    const sl = str.match(/(\d{1,2})[\/\.](\d{1,2})/);
    if (sl) return { m: parseInt(sl[1]), d: parseInt(sl[2]) };
    return null;
  };

  // 공개 페이지: 보유종목 개념 없음 → 항상 '전체 대표' 회차로 마킹
  const cycleOf = (sch, it) => {
    if (it && it.cycle) return it.cycle;
    // 기준일 → 분배락일 → 지급일 순. ⚠️ 지급일을 먼저 보면 안 된다 — 월말 회차의 지급일은 다음 달 초라
    // '일'로 가르면 월중으로 오분류된다(백엔드 _solCycle도 같은 이유로 지급일을 안 쓴다).
    // fillRakil이 기준일에서 분배락일을 채워두므로, 실제로 지급일까지 내려오는 건 둘 다 없을 때뿐이다.
    const base = parseDay(sch['기준일'] || sch['분배락일'] || sch['지급일']);
    if (!base) return '';
    // 기준일의 '일'로 회차 추정(20일 이하=월중). 월 비교(base.m===month)는 월 경계에서 깨짐.
    return base.d <= 20 ? '월중' : '월말';
  };
  // 이번 회차(오늘이 20일 이하면 월중, 넘으면 월말) 판정 — '예정' 채우기에 쓴다.
  // portfolio.html의 renderMasterCalendar와 쌍이다 — 한쪽을 고치면 반드시 다른 쪽도.
  const curCycle = now.getDate() <= 20 ? '월중' : '월말';
  const roundBySource = {};   // 운용사명 → 이번 회차 일정을 이미 냈으면 그 sched
  const roundTally = {};      // '락|기준|지급'(정규화) → {n, sch}
  // 예정에 쓰는 날짜는 이 셋뿐이다. 공시일은 운용사가 언제 낼지 우리가 알 수 없으므로 만들어내지 않는다.
  const PLAN_KEYS = ['분배락일','기준일','지급일'];
  const planSched = sch => { const o = {}; PLAN_KEYS.forEach(k => { if (sch[k]) o[k] = sch[k]; }); return o; };
  const addAll = (c, sch, it, uncertain) => {
    const cyc = cycleOf(sch, it);
    if (!uncertain && cyc === curCycle) {
      const b = parseDay(sch['기준일']);
      if (b && b.m === month) {
        roundBySource[c.name] = sch;
        // ⚠️ 날짜 문자열을 그대로 비교하면 안 된다 — 운용사마다 표기가 다르다
        // (KODEX·ACE·PLUS·RISE는 '8월 28일', TIGER는 '8/28'). 그대로 세면 같은 날인데 다른 키가 돼
        // 최빈값이 2곳에 그쳐 과반(3곳) 문턱을 못 넘었다(2026-08-27 실제로 예정이 안 떴다).
        // 공시일은 키에서 뺀다 — 운용사마다 하루씩 다르고(8/26 vs 8/27) 예정 판단에 필요 없다.
        const k = PLAN_KEYS.map(x => { const q = parseDay(sch[x]); return q ? q.m + '/' + q.d : ''; }).join('|');
        if (!roundTally[k]) roundTally[k] = { n: 0, sch: planSched(sch) };
        roundTally[k].n++;
      }
    }
    SCHED_CFG.forEach(({ key, color, text, label, short }) => {
      // 예정도 **라벨은 확정분과 똑같이** 둔다 → 같은 줄에 `SOL?` 배지로만 붙는다.
      // 라벨에 '예정'을 붙였더니 한 칸에 '분배락일'과 '분배락일 예정' 두 줄이 생겨 달력이 지저분해졌다.
      // (addMark의 회사+라벨 중복제거는 **같은 날짜 칸 안에서만** 걸리므로 라벨을 나눌 이유가 없었다.)
      const lbl = (key === '지급일' && cyc) ? `${cyc} 지급일` : label;
      const sh = (key === '지급일' && cyc) ? `${cyc} 지급일` : short;
      addMark(parseDay(sch[key]), c.name, c.color, lbl, color, text, sh, uncertain);
    });
  };

  // 분배락일 = 지급기준일 직전 영업일. 주말과 공휴일(HOLIDAYS)을 모두 건너뛴다.
  // 예전엔 주말만 걸러서, 기준일이 8/18(화)이면 8/17(광복절 대체)을 락일로 찍었다.
  const prevBizDay = (m, d) => {
    const dt = new Date(year, m - 1, d);
    do { dt.setDate(dt.getDate() - 1); }
    while (dt.getDay() === 0 || dt.getDay() === 6 || HOLIDAYS[`${dt.getFullYear()}-${dt.getMonth() + 1}-${dt.getDate()}`]);
    return { m: dt.getMonth() + 1, d: dt.getDate() };
  };
  const fillRakil = (sched, repSched) => {
    if (!sched) return sched;
    if (!sched['공시일'] && repSched && repSched['공시일']) sched['공시일'] = repSched['공시일'];
    if (!sched['분배락일'] && sched['기준일']) {
      const base = parseDay(sched['기준일']);
      if (base) { const p = prevBizDay(base.m, base.d); sched['분배락일'] = p.m + '월 ' + p.d + '일'; }
    }
    return sched;
  };

  const nextMonth = month === 12 ? 1 : month + 1;
  const prevMonth = month === 1 ? 12 : month - 1;
  const marks = {};
  const addMark = (p, source, sourceColor, label, labelColor, labelText, shortLabel, uncertain) => {
    if (!p) return;
    if (p.m !== month && p.m !== nextMonth && p.m !== prevMonth) return;
    const k = `${p.m}-${p.d}`;
    if (!marks[k]) marks[k] = [];
    if (marks[k].some(x => x.source === source && x.label === label)) return;
    marks[k].push({ source, sourceColor, label, labelColor, labelText: labelText || labelColor, shortLabel: shortLabel || label, uncertain: !!uncertain });
  };
  allData.forEach(c => {
    const repSched = (c.data && c.data.schedule) || {};
    const items = (c.data && c.data.items) || [];
    const inRange = sch => {
      const b = parseDay(sch['기준일']), p = parseDay(sch['지급일']);
      const ok = x => x && (x.m === month || x.m === nextMonth || x.m === prevMonth);
      if (ok(b)) return true;
      if (p && (p.m === month || p.m === nextMonth)) return true;
      return false;
    };
    const markedCyc = new Set();
    // 회차(월중/월말)별 대표 1개씩 마킹
    ['월중','월말'].forEach(cyc => {
      if (markedCyc.has(cyc)) return;
      const rep = items.find(it => {
        const sch = fillRakil(it.sched && Object.keys(it.sched).length ? {...it.sched} : {...repSched}, repSched);
        return cycleOf(sch, it) === cyc && inRange(sch);
      });
      if (rep) {
        const sch = fillRakil(rep.sched && Object.keys(rep.sched).length ? {...rep.sched} : {...repSched}, repSched);
        addAll(c, sch, rep);
        markedCyc.add(cyc);
      }
    });
    if (!markedCyc.size) {
      const sch = fillRakil({...repSched}, repSched);
      if (inRange(sch)) addAll(c, sch);
    }
  });

  // ── 아직 공지를 안 낸 운용사: 나머지 운용사의 합의 일정으로 '예정' 표시 ──
  // 6개사가 같은 날을 쓴다(2026-08-27 실측: KODEX·TIGER·ACE·PLUS·RISE 전부 분배락 8/28·기준 8/31·지급 9/2).
  // SOL은 블로그에 늦게 올려서 그 달 월말이 통째로 비어 보이는데, 실제로는 거의 확실히 같은 날이다.
  // ⚠️ 화면에서만 만든다 — 분배캐시에 쓰면 워치독·이력 병합이 **만들어낸 날짜를 실제 공시로** 취급한다.
  // 과반(6곳 중 3곳 이상)이 같은 날일 때만 만든다. 회차 초반이라 아무도 안 냈으면 예정도 안 만든다.
  const roundBest = Object.keys(roundTally).map(k => roundTally[k]).sort((a, b) => b.n - a.n)[0];
  if (roundBest && roundBest.n >= 3) {
    allData.forEach(c => {
      if (!c.name || roundBySource[c.name]) return;
      addAll(c, roundBest.sch, null, true);
    });
  }

  const today = now.getDate();
  const dowsShow = ['월','화','수','목','금']; // 평일만

  // 오늘이 속한 주가 5주 창의 가운데(3번째 줄)에 오도록 2주 전 일요일부터 시작.
  // ←/→ 버튼은 여기에 주 단위로만 더해져 항상 한 주씩 움직인다.
  const todayDate = new Date(year, month - 1, now.getDate());
  const rangeStart = new Date(todayDate);
  rangeStart.setDate(rangeStart.getDate() - rangeStart.getDay() - 14);
  rangeStart.setDate(rangeStart.getDate() + _calWeekOffset * 7);
  const rangeEnd = new Date(rangeStart);
  rangeEnd.setDate(rangeEnd.getDate() + 34);

  const cells = [];
  const cur = new Date(rangeStart);
  while (cur <= rangeEnd) {
    const dw = cur.getDay();
    if (dw !== 0 && dw !== 6) cells.push({ y: cur.getFullYear(), m: cur.getMonth() + 1, d: cur.getDate(), next: false });
    cur.setDate(cur.getDate() + 1);
  }

  const cellHtml = (cell) => {
    if (!cell) return '<div class="cal-cell"></div>';
    const { y, m, d, next } = cell;
    const dow = new Date(year, m - 1, d).getDay();
    const ms = marks[`${m}-${d}`] || [];
    const hol = HOLIDAYS[`${y}-${m}-${d}`];
    const isToday = m === month && d === today;
    const weekendBg = dow === 0 ? 'background:#fef6f6;' : dow === 6 ? 'background:#f5f8ff;' : '';
    const bg = isToday ? 'background:#eff6ff;' : ms.length ? 'background:var(--bg3);' : weekendBg;
    const border = isToday ? 'border:2px solid #3b82f6;' : 'border:1px solid var(--border);';
    const dateColor = isToday ? '#2563eb' : (hol || dow === 0) ? '#dc2626' : dow === 6 ? '#2563eb' : 'var(--text)';
    const byLabel = {};
    ms.forEach(mk => {
      if (!byLabel[mk.label]) byLabel[mk.label] = { labelColor: mk.labelColor, labelText: mk.labelText, shortLabel: mk.shortLabel, sources: [] };
      byLabel[mk.label].sources.push({ name: mk.source, color: mk.sourceColor, uncertain: mk.uncertain });
    });
    const eventHtml = Object.keys(byLabel).map(label => {
      const g = byLabel[label];
      // 고정 슬롯: 윗줄 KODEX·TIGER·ACE / 아랫줄 PLUS·RISE·SOL, 없는 회사는 빈칸
      const bySource = {};
      g.sources.forEach(s => { bySource[s.name] = { color: s.color, uncertain: s.uncertain }; });
      const icons = DIST_SOURCES.map(s => { const b = bySource[s.name]; const q = b && b.uncertain ? '?' : '';
        return b
        ? `<span class="cal-chip" style="background:${b.color}"><span class="chip-full">${s.name}${q}</span><span class="chip-min">${s.name.slice(0,3)}${q}</span></span>`
        : '<span class="cal-chip"></span>';
      }).join('');
      return `<div style="margin-top:4px">
        <div class="cal-icons">${icons}</div>
        <div class="cal-evt" style="background:${g.labelColor}1a;color:${g.labelText || g.labelColor}"><span class="lbl-full">${label}</span><span class="lbl-short">${g.shortLabel || label}</span></div>
      </div>`;
    }).join('');
    return `<div class="cal-cell" style="${bg}${border}">
      <div class="cal-date" style="font-weight:${ms.length||isToday||hol?'700':'400'};color:${dateColor}">${m}/${d}${hol ? `<span class="cal-hol">${hol}</span>` : ''}</div>
      <div style="margin-top:auto">${eventHtml}</div>
    </div>`;
  };

  // ── 회차 상태 한 줄 ──
  // 달력을 보고 나면 사용자가 하는 질문은 하나다: "지금 사면 받나, 놓쳤나."
  // 그 답이 지금까지 세 번째 패널의 상시 안내 문구에만 있었고 모바일 기본 탭에선 안 보였다.
  // 새 데이터 소스는 없다 — 방금 만든 marks 와 prevBizDay 를 그대로 쓴다.
  const _md = k => ({ m: +k.split('-')[0], d: +k.split('-')[1] });
  const _dt = q => new Date(year, q.m - 1, q.d);
  const _t0 = new Date(year, month - 1, today);
  const _DOW = ['일','월','화','수','목','금','토'];
  const _fmt = q => `${q.m}/${q.d}(${_DOW[_dt(q).getDay()]})`;
  const _days = (a, b) => Math.round((b - a) / 86400000);
  const _pick = (test, from, before) => Object.keys(marks)
    .filter(k => marks[k].some(x => test(x.label)))
    .map(_md).map(q => ({ q, dt: _dt(q) }))
    .filter(x => (!from || x.dt >= from) && (!before || x.dt <= before))
    .sort((a, b) => a.dt - b.dt)[0];
  const _isRak = l => l === '분배락일';
  const _isStd = l => l.indexOf('기준일') >= 0;
  const _isPay = l => /지급일$/.test(l) && l.indexOf('기준') < 0;
  const statusHtml = (() => {
    const rakToday = _pick(_isRak, _t0, _t0);
    const rakNext = _pick(_isRak, new Date(_t0.getTime() + 86400000));
    const rak = rakToday || rakNext;
    // 다음 회차 분배락이 아직 안 잡혔으면(회차 사이) 남은 지급 예정만 알린다 — 날짜를 만들어내지 않는다.
    if (!rak) {
      const pay = _pick(_isPay, _t0);
      return pay ? `이번 회차 매수는 끝났습니다 · 지급 <b>${_fmt(pay.q)}</b> 예정 — 다음 회차 공지는 아직 없습니다`
                 : '';
    }
    const cut = prevBizDay(rak.q.m, rak.q.d);                 // 매수 마감 = 분배락 직전 영업일
    const std = _pick(_isStd, rak.dt), pay = _pick(_isPay, rak.dt);
    const tail = `${std ? ` · 기준일 <b>${_fmt(std.q)}</b>` : ''}${pay ? ` · 지급 <b>${_fmt(pay.q)}</b>` : ''}`;
    if (rakToday) return `<b>오늘 ${_fmt(rak.q)} 분배락일</b> — 이 회차 매수는 <b>${_fmt(cut)}</b>로 마감됐습니다${tail}`;
    const dday = _days(_t0, _dt(cut));
    if (dday < 0) return `이 회차 매수는 <b>${_fmt(cut)}</b>로 마감됐습니다 · 분배락 ${_fmt(rak.q)}${tail}`;
    return `다음 매수 마감 <b>${_fmt(cut)}</b> ${dday === 0 ? '<b>오늘까지</b>' : `<b>D-${dday}</b>`} — 그날까지 사면 받습니다 · 분배락 ${_fmt(rak.q)}${tail}`;
  })();

  const calHtml = `
    <div>
      ${statusHtml ? `<div class="cal-status">${statusHtml}</div>` : ''}
      <div class="cal-companies">
        ${DIST_SOURCES.map(s => `<span class="cal-co"><span class="co-chip" style="background:${s.color}">${s.name.slice(0,3)}</span>${s.name}</span>`).join('')}
      </div>
      <div class="cal-grid">
        ${dowsShow.map(d => `<div class="cal-dow">${d}</div>`).join('')}
        ${cells.map(cellHtml).join('')}
      </div>
    </div>`;
  document.getElementById('distMasterCalendar').innerHTML = calHtml;

  // ── 운용사별 일정 표 (월중/월말 2줄) ──
  // ←/→ 버튼으로 고른 달(selM)의 일정만 표시. 행 귀속 월은 기준일(없으면 지급일)의 월.
  const selM = ((month - 1 + _schedMonthOffset) % 12 + 12) % 12 + 1;
  const schedTitle = document.getElementById('schedTitle');
  if (schedTitle) schedTitle.textContent = `🏢 ${selM}월 운용사별 일정`;
  const rowsData = [];
  allData.forEach(c => {
    const repSched = (c.data && c.data.schedule) || {};
    const items = (c.data && c.data.items) || [];
    const pickCycle = (cyc) => {
      for (const it of items) {
        const sch = fillRakil((it.sched && Object.keys(it.sched).length) ? {...it.sched} : {...repSched}, repSched);
        if (cycleOf(sch, it) !== cyc) continue;
        // 월 귀속도 기준일 → 분배락일 → 지급일 순 (지급일만 보면 월말 회차가 다음 달로 새어나간다)
        const p = parseDay(sch['기준일'] || sch['분배락일'] || sch['지급일']);
        if (!p || p.m !== selM) continue;
        return { sched: sch, hasNotice: true };
      }
      return { sched: null, hasNotice: false };
    };
    const mid = pickCycle('월중'), end = pickCycle('월말');
    if (!mid.hasNotice && !end.hasNotice) return;
    rowsData.push({ name: c.name, color: c.color, mid, end });
  });

  // 아직 공지를 안 낸 회차 칸은 나머지 운용사의 합의 일정으로 채우고 '예정'으로 표시한다.
  // 달력의 예정과 같은 근거·같은 기준(과반 3곳 이상) — SOL 8월 월말처럼 한 줄이 통째로 '·'만 남는 걸 막는다.
  // ⚠️ 화면에서만 만든다(분배캐시엔 안 쓴다). portfolio.html의 같은 블록과 쌍이다.
  ['mid', 'end'].forEach(slot => {
    const tally = {};
    rowsData.forEach(r => {
      if (!r[slot].hasNotice || !r[slot].sched) return;
      // ⚠️ 달력 쪽과 같은 이유로 parseDay 정규화가 필요하다 — TIGER 만 '8/28', 나머지는 '8월 28일'.
      // 공시일은 키에서 빼고(운용사마다 8/26·8/27로 갈린다) 예정 sched 에도 안 넣는다.
      const k = PLAN_KEYS.map(x => { const q = parseDay(r[slot].sched[x]); return q ? q.m + '/' + q.d : ''; }).join('|');
      if (!tally[k]) tally[k] = { n: 0, sched: planSched(r[slot].sched) };
      tally[k].n++;
    });
    const best = Object.keys(tally).map(k => tally[k]).sort((a, b) => b.n - a.n)[0];
    if (!best || best.n < 3) return;
    rowsData.forEach(r => {
      if (r[slot].hasNotice) return;
      r[slot] = { sched: best.sched, hasNotice: true, planned: true };
    });
  });

  const dcell = (info, key) => {
    if (!info || !info.hasNotice) return '';
    const v = info.sched && info.sched[key];
    if (!v) return '';
    const p = parseDay(v);
    return p ? `${p.m}/${p.d}` : v;
  };
  // 회차(월중/월말)마다 실제 행을 나눠 그린다. 운용사명은 rowspan.
  // 월중/월말은 행 전체 배경색으로 구분, 회차엔 해당 월을 붙여 표시(예: 7월 월중).
  // 공지 없는 회차도 줄은 유지(날짜만 비움).
  const CYC = { '월중': ['#ecfeff', '#0e7490'], '월말': ['#f5f3ff', '#6d28d9'] };
  const dateCell = (info, key, col, bg) => {
    const v = dcell(info, key);
    const txt = v || '·';
    // 예정은 같은 색을 연하게(점선 밑줄) — 확정과 한눈에 구분되되 표가 시끄러워지지 않게.
    const extra = (v && info && info.planned) ? `;opacity:.55;border-bottom:1px dashed ${col}` : '';
    return `<td style="text-align:center;padding:5px 3px;font-family:var(--mono);white-space:nowrap;font-weight:600;background:${bg};color:${v ? col : '#cbd5e1'}${extra}">${txt}</td>`;
  };
  const tableHtml = rowsData.length ? `
    <table>
      <thead><tr>
        <th style="text-align:left;padding:6px 8px">운용사</th>
        <th style="text-align:left;padding:6px 6px">회차</th>
        <th style="text-align:center;color:#d97706">공시</th>
        <th style="text-align:center;color:#16a34a">분배락</th>
        <th style="text-align:center;color:#2563eb">기준</th>
        <th style="text-align:center;color:#dc2626">지급</th>
      </tr></thead>
      <tbody>${rowsData.map(r => {
        const cycles = [['월중', r.mid], ['월말', r.end]];
        return cycles.map(([label, m], i) => {
          const [bg, col] = CYC[label];
          const monLabel = selM + '월 ' + label; // 제목의 달과 항상 일치
          const nameCell = i === 0
            ? `<td rowspan="${cycles.length}" style="padding:5px 8px;white-space:nowrap;vertical-align:middle"><span style="font-weight:700;color:${r.color}">${r.name}</span></td>`
            : '';
          return `<tr>
            ${nameCell}
            <td style="padding:5px 6px;white-space:nowrap;background:${bg};color:${col};font-weight:700">${monLabel}${m.planned ? ' <span style="color:#0891b2;font-size:10px;font-weight:700">(예정)</span>' : ''}</td>
            ${dateCell(m, '공시일', '#d97706', bg)}
            ${dateCell(m, '분배락일', '#16a34a', bg)}
            ${dateCell(m, '기준일', '#2563eb', bg)}
            ${dateCell(m, '지급일', '#dc2626', bg)}
          </tr>`;
        }).join('');
      }).join('')}</tbody>
    </table>` : `<div style="font-size:12px;color:var(--text3)">${selM}월 일정 정보가 없습니다</div>`;
  document.getElementById('distScheduleList').innerHTML = tableHtml;
}

// ── 공지 제목 → 통일 형식 ──
function normalizeNoticeTitle(title, source){
  if (!title) return { label: '공지', cycle: '기타', mon: 0 };
  const monM = title.match(/(\d{1,2})\s*월/);
  const mon = monM ? parseInt(monM[1]) : 0;
  if (source === 'ace') {
    if (/국고채|국채\s*3년/.test(title)) return { label: '비정기', cycle: '제외', mon };
    if (/데일리타겟|미국배당다우존스|시리즈/.test(title))
      return { label: (mon?mon+'월 ':'') + '월중배당', cycle: '월중', mon };
    return { label: (mon?mon+'월 ':'') + '월말배당', cycle: '월말', mon };
  }
  let cycle, label;
  if (/월말|말\s*분배|②|안내\s*②/.test(title)) { cycle = '월말'; label = (mon?mon+'월 ':'') + '월말배당'; }
  else if (/월중|중순|중간|①|안내\s*①/.test(title)) { cycle = '월중'; label = (mon?mon+'월 ':'') + '월중배당'; }
  else if (/특별|임시|추가|결산/.test(title)) { cycle = '특별'; label = (mon?mon+'월 ':'') + '특별배당'; }
  else { cycle = '기타'; label = (mon?mon+'월 ':'') + '분배금 공지'; }
  return { label, cycle, mon };
}

let _noticeData = null;    // 공지 원본 (월 이동 시 재사용)
let _noticeMonthOffset = 0; // 분배금 공지 패널: 월 단위 이동 (0=이번 달)

function noticeShiftMonth(dir){
  if (!_noticeData) return;
  _noticeMonthOffset = Math.max(-1, Math.min(1, _noticeMonthOffset + dir));
  renderNotices();
}

// 공지 스냅샷: 백엔드 응답이 평소 1.6초인데 5회에 1번꼴로 6~19초까지 튄다. 이 패널은 6개사가
// 다 모여야 한 번에 그리므로 그동안 통째로 "불러오는 중…"에 멈춘다. 지난번 공지를 즉시 그려두고
// 뒤에서 갱신한다. (portfolio.html의 loadAllNotices와 같은 처리 — 한쪽을 고치면 양쪽 다.)
const _NSNAP_KEY = 'jjk_dnsnap_v1';

async function loadAllNotices(){
  const grid = document.getElementById('noticeGrid');
  if (!grid) return;
  let snap = null;
  try { snap = JSON.parse(localStorage.getItem(_NSNAP_KEY)); } catch(e) {}
  const painted = !!(snap && snap.length);
  if (painted) {
    _noticeData = snap;
    renderNotices();
    const t = document.getElementById('noticeTitle');   // renderNotices가 제목을 새로 쓰므로 그 뒤에 붙인다
    if (t) t.textContent += ' ⟳';
  } else {
    grid.innerHTML = '<div class="notice-loading">불러오는 중...</div>';
  }
  // 빠른 경로: 6개사 공지를 서버 캐시에서 한 번에(예전엔 운용사별 6번 → 캐시 미스 1건이 10초).
  // 캐시에 없는 곳만 기존대로 개별 병렬 요청 — 재배포 전이면 벌크가 비어 전부 이 경로로 간다.
  const bulk = await api({ action: 'getEtfNoticesAll' }).catch(() => null);
  const cached = (bulk && bulk.sources) || {};
  const results = await Promise.allSettled(NOTICE_SOURCES.map(s => {
    const hit = cached[s.id];
    if (hit && !hit.stale) return Promise.resolve({ ...s, items: hit.items || [], ok: true });
    return s.fetch().then(items => ({ ...s, items, ok: true })).catch(() => ({ ...s, items: [], ok: false }));
  }));
  _noticeData = results.map(r => r.value || {});
  renderNotices();
                                      // 제목의 ' ⟳'도 여기서 지워진다
  // 전부 0건이면 스냅샷을 덮지 않는다 — 일시적 실패가 다음 방문의 빈 화면으로 굳는 걸 막는다.
  // (fetch 함수는 JSON 직렬화에서 자동으로 빠지고, renderNotices는 id·name·label·items만 쓴다.)
  if (_noticeData.some(d => (d.items || []).length))
    try { localStorage.setItem(_NSNAP_KEY, JSON.stringify(_noticeData)); } catch(e) {}
}

function renderNotices(){
  const grid = document.getElementById('noticeGrid');
  if (!grid || !_noticeData) return;
  const now = new Date();
  const selM = ((now.getMonth() + _noticeMonthOffset) % 12 + 12) % 12 + 1;
  const title = document.getElementById('noticeTitle');
  if (title) title.textContent = `📢 (${selM}월) 분배금 공지`;
  // 공지의 귀속 월: 제목의 'N월'(norm.mon) 우선, 없으면 등록일의 월
  const monOf = n => {
    if (n.norm.mon) return n.norm.mon;
    const m = String(n.date || '').match(/\d{4}[.\-\/](\d{1,2})/);
    return m ? parseInt(m[1]) : 0;
  };
  grid.innerHTML = _noticeData.map(({ id, name, label, items, ok }) => {
    const all = (items || []).map(n => ({ ...n, norm: normalizeNoticeTitle(n.title, id) }))
      .filter(n => n.norm.cycle !== '제외');
    const inMonth = all.filter(n => monOf(n) === selM);
    const pickByCycle = cyc => {
      const cand = inMonth.filter(n => n.norm.cycle === cyc);
      if (!cand.length) return null;
      cand.sort((a,b) => String(b.date||'').localeCompare(String(a.date||'')));
      return cand[0];
    };
    // 월중/월말 슬롯은 공지가 없어도 자리를 비워둔다(카드 높이·순서 고정). 특별·기타는 있을 때만.
    const picks = [pickByCycle('월중'), pickByCycle('월말'), pickByCycle('특별')];
    const extra = picks.every(p => !p) ? inMonth.slice(0, 1) : []; // 회차 분류 안 된 공지 폴백
    // 등록 7일 이내 공지엔 NEW 배지 — 월중 공시(10~13일)→기준일(15일) 흐름을 다 덮게
    const isNew = n => {
      const m = String(n.date || '').match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
      if (!m) return false;
      return (Date.now() - new Date(+m[1], +m[2] - 1, +m[3]).getTime()) < 7 * 86400000;
    };
    const itemHtml = n => `
          <div class="notice-item">
            <span class="notice-title" onclick="window.open('${safeUrl(n.url)}','_blank')" title="${(n.title||'').replace(/"/g,'&quot;')}">${n.norm.label}${isNew(n) ? '<span class="new-badge">NEW</span>' : ''}</span>
            <span class="notice-date">${n.date}</span>
          </div>`;
    const emptySlot = cyc => `
          <div class="notice-item">
            <span style="font-size:12px;color:var(--text3);line-height:1.4">${selM}월 ${cyc}배당</span>
            <span class="notice-date">-</span>
          </div>`;
    const rows = (items && items.length)
      ? [ picks[0] ? itemHtml(picks[0]) : emptySlot('월중'),
          picks[1] ? itemHtml(picks[1]) : emptySlot('월말'),
          picks[2] ? itemHtml(picks[2]) : '',
          ...extra.map(itemHtml) ].join('')
      // 응답은 왔는데 이번 달 공지가 아직 없는 것과, 못 받아온 것은 다른 상태다.
      // 예전엔 둘 다 '불러오기 실패'라 정상인데도 빨간 글씨가 떴다.
      : (ok === false ? '<div class="notice-err">공지를 못 받았습니다</div>'
                      : `<div class="notice-empty">${selM}월 공지 아직 없음</div>`);
    return `
      <div class="notice-card ${id}">
        <div class="notice-brand ${id}">● ${name} <span style="font-weight:400;color:var(--text3)">${label}</span></div>
        ${rows}
      </div>`;
  }).join('');
  renderNoticeBoard();
}

// ── 공지 종목 전체 (하단 섹션) ──
// 포트폴리오 앱의 '내 보유 종목 분배 내역'과 같은 레이아웃(운용사별 카드 3×2, 표)로
// 공지 종목을 ←/→로 고른 달(기준일 기준)만 표시. 이력(hist)은 제외.
const esc = s => String(s || '').replace(/</g, '&lt;').replace(/"/g, '&quot;');

// 운용사 카드 하단 '특별 공지' 줄. 좌측 공지 패널이 쓰는 _noticeData를 그대로 재사용한다(새 데이터 소스 0).
// 정기 월중·월말 회차는 위 표와 좌측 패널에 이미 있으니 빼고, **비정기 사건만** 최근 90일 최대 3건.
// 제목 키워드로만 판정한다 — normalizeNoticeTitle의 cycle은 ACE 분기에서 특별 공지도 '월말'로 떨어진다.
const NOTICE_COLOR = { kodex:'#2563eb', tiger:'#f97316', ace:'#059669', plus:'#7c3aed', rise:'#dc2626', sol:'#0891b2' };
const DIST_ISSUE_RE = /특별|임시|추가분배|결산|상장폐지|해지|청산|합병|분할|병합|정정|변경|중단|투자유의|괴리/;
function distIssueNotices(items, now){
  const t = now || Date.now();
  return (items || [])
    .filter(n => {
      if (!DIST_ISSUE_RE.test(n.title || '')) return false;
      const m = String(n.date || '').match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
      return m ? (t - new Date(+m[1], +m[2] - 1, +m[3]).getTime()) < 90 * 86400000 : false;
    })
    .sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')))
    .slice(0, 3);
}
// 🏢 운용사별 일정 패널 아래 '공지사항' 게시판. 좌측 공지 패널이 이미 받아둔 _noticeData를
// 그대로 쓴다(새 데이터 소스 0). 정기 월중·월말 회차는 위 표·좌측 패널에 이미 있으니 빼고,
// 특별분배·정정·상장폐지 같은 **비정기 건만** 6개사를 합쳐 최근 90일 최대 5건, 최신순.
// 비어 있어도 틀은 남긴다 — 안 그리면 자리가 있는지조차 화면에서 확인이 안 된다.
function renderNoticeBoard() {
  const box = document.getElementById('distNoticeBoard');
  if (!box) return;
  const rows = [];
  (_noticeData || []).forEach(d => {
    distIssueNotices(d.items).forEach(n => rows.push({ ...n, src: d.id, name: d.name }));
  });
  rows.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
  const top = rows.slice(0, 5);
  // 옆의 운용사별 일정 표와 같은 테두리·각진 모서리로 맞춘다(2px 바깥선 + 1px 행 구분선).
  const line = (badge, color, text, date, url, last) => `
    <div style="display:flex;align-items:center;gap:6px;min-width:0;padding:5px 8px${last ? '' : ';border-bottom:1px solid #64748b'}">
      <span style="flex-shrink:0;background:${color}1a;color:${color};font-size:9px;font-weight:800;padding:1px 5px;border-radius:3px">${badge}</span>
      ${safeUrl(url) ? `<a href="${safeUrl(url)}" target="_blank" rel="noopener noreferrer" style="flex:1;min-width:0;font-size:11px;line-height:1.3;color:var(--text);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${text.replace(/"/g,'&quot;')}">${text}</a>`
            : `<span style="flex:1;min-width:0;font-size:11px;line-height:1.3;color:var(--text3)">${text}</span>`}
      <span style="flex-shrink:0;font-family:var(--mono);font-size:10px;color:var(--text3)">${date}</span>
    </div>`;
  // 상시 안내 — 운용사 데이터가 아니라 고정 문구다. 매달 헷갈리는 지점이라 게시판 맨 위에 늘 둔다.
  // 한국 주식은 T+2 결제라 분배락일에 사면 지급기준일 주주명부에 못 든다 ⇒ 매수 마감은 락일 '전날'이다.
  // portfolio.html의 renderNoticeBoard와 쌍이다 — 한쪽을 고치면 반드시 다른 쪽도.
  const fixed = `
    <div style="display:flex;align-items:center;gap:6px;min-width:0;padding:5px 8px;border-bottom:1px solid #64748b;background:#ecfeff">
      <span style="flex-shrink:0;background:#0891b21a;color:#0891b2;font-size:9px;font-weight:800;padding:1px 5px;border-radius:3px">안내</span>
      <span style="flex:1;min-width:0;font-size:11px;line-height:1.3;color:var(--text)"><b>분배락일 전날</b>까지 사야 받습니다</span>
      <span style="flex-shrink:0;font-family:var(--mono);font-size:10px;color:var(--text3)">상시</span>
    </div>`;
  const body = fixed + (top.length
    ? top.map((n, i) => line(n.name, NOTICE_COLOR[n.src] || '#a855a8',
                        (n.title || '').replace(/</g, '&lt;'), (n.date || '').slice(5), n.url,
                        i === top.length - 1)).join('')
    : line('공지', '#a855a8', '등록된 공지사항 없음', '-', '', true));
  box.innerHTML = `<div style="margin-top:10px;border:2px solid #111827;background:var(--bg2)">
    <div style="padding:6px 8px;background:#f3e8f5;border-bottom:1px solid #111827;font-size:11px;font-weight:700;color:#a855a8">📌 공지사항</div>
    ${body}
  </div>`;
}


// ── 관심 종목 ──
// 공시 종목이 100개가 넘어 방문자마다 보고 싶은 것만 남길 수 있게 한다.
// 저장은 그 사람 브라우저(localStorage)에만 — 서버에 아무것도 안 남고 방문자끼리 섞이지도 않는다.
const FAV_KEY = 'distFav', FAVONLY_KEY = 'distFavOnly', HIDE_KEY = 'distHide';
const readSet = k => { try { return new Set(JSON.parse(localStorage.getItem(k)) || []); } catch(e) { return new Set(); } };
let _fav = readSet(FAV_KEY);
let _favOnly = localStorage.getItem(FAVONLY_KEY) === '1';
// 숨긴 종목: 다음에 다시 들어와도 그대로 빠져 있게 localStorage 에 남긴다.
let _hide = readSet(HIDE_KEY);
let _showHidden = false;                  // 숨긴 것을 되돌리려고 잠깐 보는 모드 (저장 안 함)
let _gridData = [];                       // 별을 눌렀을 때 다시 그리려고 마지막 데이터를 들고 있는다

function toggleFav(ticker){
  if (!ticker) return;
  _fav.has(ticker) ? _fav.delete(ticker) : _fav.add(ticker);
  localStorage.setItem(FAV_KEY, JSON.stringify([..._fav]));
  renderDistGrid(_gridData);
}
function toggleFavOnly(){
  _favOnly = !_favOnly;
  localStorage.setItem(FAVONLY_KEY, _favOnly ? '1' : '0');
  renderDistGrid(_gridData);
}
function toggleHide(ticker){
  if (!ticker) return;
  _hide.has(ticker) ? _hide.delete(ticker) : _hide.add(ticker);
  localStorage.setItem(HIDE_KEY, JSON.stringify([..._hide]));
  renderDistGrid(_gridData);
}
function toggleShowHidden(){
  _showHidden = !_showHidden;
  renderDistGrid(_gridData);
}
function clearHidden(){
  _hide.clear();
  localStorage.setItem(HIDE_KEY, '[]');
  renderDistGrid(_gridData);
}

function renderDistGrid(allData){
  const grid = document.getElementById('distGrid');
  if (!grid) return;
  _gridData = allData || _gridData;
  allData = _gridData;
  const favBtn = document.getElementById('favToggle');
  if (favBtn) {
    favBtn.textContent = (_favOnly ? '★ 관심만' : '☆ 관심만') + (_fav.size ? ` (${_fav.size})` : '');
    favBtn.style.background = _favOnly ? '#f59e0b' : 'var(--bg2)';
    favBtn.style.color = _favOnly ? '#fff' : 'var(--text)';
    favBtn.style.borderColor = _favOnly ? '#f59e0b' : 'var(--border)';
  }
  const hideBtn = document.getElementById('hideToggle');
  if (hideBtn) {
    hideBtn.textContent = (_showHidden ? '👁 숨김' : '🙈 숨김') + (_hide.size ? ` (${_hide.size})` : '');
    hideBtn.style.background = _showHidden ? '#64748b' : 'var(--bg2)';
    hideBtn.style.color = _showHidden ? '#fff' : 'var(--text)';
    hideBtn.style.borderColor = _showHidden ? '#64748b' : 'var(--border)';
  }
  const curMonth = new Date().getMonth() + 1;
  // ←/→ 로 고른 달만 표시(기준일 없으면 지급일의 월로 귀속)
  const selM = ((curMonth - 1 + _gridMonthOffset) % 12 + 12) % 12 + 1;
  const gridTitle = document.getElementById('gridTitle');
  if (gridTitle) gridTitle.textContent = `📋 ${selM}월 공지 종목 전체`;
  const monthOf = (s) => {
    s = String(s || '');
    let m = s.match(/(\d{1,2})월/);            if (m) return parseInt(m[1]);
    m = s.match(/(\d{1,2})[\/\.]\d{1,2}/);      if (m) return parseInt(m[1]);
    return null;
  };
  const cycleOf = (it, repSched) => {
    if (it && it.cycle) return it.cycle;
    const sch = (it.sched && Object.keys(it.sched).length) ? it.sched : (repSched || {});
    const ref = sch['기준일'] || sch['지급일'] || '';
    const m = ref.match(/(\d{1,2})월\s*(\d{1,2})일/) || ref.match(/\d{1,2}[\/\.](\d{1,2})/);
    if (!m) return '';
    const day = m[2] != null ? parseInt(m[2]) : parseInt(m[1]);
    return day <= 20 ? '월중' : '월말';
  };
  const cards = allData.map(c => {
    const d = c.data || {};
    const monthItems = (d.items || []).filter(it => {
      if (it.hist) return false;
      const sch = (it.sched && Object.keys(it.sched).length) ? it.sched : (d.schedule || {});
      return monthOf(sch['기준일'] || sch['지급일']) === selM;   // 선택한 달의 회차만
    });
    const items = monthItems.filter(it => {
      if (_hide.has(it.ticker) && !_showHidden) return false;    // 방문자가 숨긴 종목
      return !(_favOnly && _fav.size) || _fav.has(it.ticker);
    });
    // 그 달 공지는 있는데 걸러져 남은 게 없으면(전부 숨겼거나 관심 밖) 카드를 통째로 뺀다.
    if (monthItems.length && !items.length) return '';
    // 전달 대비 증감(%) — 백엔드가 이미 붙여 보내는 hist(직전 회차) 항목에서
    // 같은 종목·같은 주기의 지난달 분배금을 찾는다. 서버·배포는 손대지 않는다.
    const prevM = selM === 1 ? 12 : selM - 1;
    const prevAmt = new Map();
    (d.items || []).forEach(it => {
      if (!it.hist || it.amount == null) return;
      const sch = (it.sched && Object.keys(it.sched).length) ? it.sched : (d.schedule || {});
      if (monthOf(sch['기준일'] || sch['지급일']) !== prevM) return;
      prevAmt.set((it.ticker || it.name) + '|' + cycleOf(it, d.schedule), Number(it.amount));
    });
    const chgHtml = (it, cyc) => {
      const p = prevAmt.get((it.ticker || it.name) + '|' + cyc);
      if (!p || it.amount == null) return '<span style="color:var(--text3)" title="전달 회차 데이터 없음">-</span>';
      const pct = (Number(it.amount) - p) / p * 100;
      const col = pct > 0 ? 'var(--green)' : pct < 0 ? 'var(--red)' : 'var(--text2)';
      const mark = pct > 0 ? '▲' : pct < 0 ? '▼' : '';
      return `<span style="color:${col}" title="전달 ${p.toLocaleString()}원">${mark}${Math.abs(pct).toFixed(1)}%</span>`;
    };
    let body;
    if (items.length) {
      body = `<div class="dist-items"><table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="background:var(--bg3)">
          <th style="padding:5px 2px;text-align:center;font-size:10px;color:var(--text3);border:1px solid var(--border)" title="별을 눌러 관심 종목으로 담습니다">★</th>
          <th style="padding:5px 6px;text-align:center;font-size:10px;color:var(--text3);border:1px solid var(--border)">주기</th>
          <th class="dg-code" style="padding:5px 8px;text-align:left;font-size:10px;color:var(--text3);border:1px solid var(--border)">코드</th>
          <th style="padding:5px 8px;text-align:left;font-size:10px;color:var(--text3);border:1px solid var(--border)">종목명</th>
          <th style="padding:5px 8px;text-align:right;font-size:10px;color:var(--text3);border:1px solid var(--border)">분배금</th>
          <th style="padding:5px 8px;text-align:right;font-size:10px;color:var(--text3);border:1px solid var(--border)">분배율</th>
          <th style="padding:5px 8px;text-align:right;font-size:10px;color:var(--text3);border:1px solid var(--border)">전달비</th>
          <th style="padding:5px 2px;text-align:center;font-size:10px;color:var(--text3);border:1px solid var(--border)" title="✕를 눌러 목록에서 숨깁니다">✕</th>
        </tr></thead>
        <tbody>${items.map(it => {
          const cyc = cycleOf(it, d.schedule);
          const cycColor = cyc === '월중' ? '#2563eb' : cyc === '월말' ? '#db2777' : 'var(--text3)';
          const rowBg = cyc === '월중' ? 'background:#2563eb0a;' : cyc === '월말' ? 'background:#db27770a;' : '';
          const on = _fav.has(it.ticker);
          const off = _hide.has(it.ticker);                 // 숨김 보기 모드에서만 화면에 남는다
          return `<tr style="${rowBg}${off ? 'opacity:.45;' : ''}">
          <td onclick="toggleFav('${it.ticker || ''}')" title="관심 종목 담기/빼기" style="padding:5px 2px;text-align:center;cursor:pointer;user-select:none;font-size:13px;line-height:1;color:${on ? '#f59e0b' : 'var(--text3)'};border:1px solid var(--border)">${on ? '★' : '☆'}</td>
          <td style="padding:5px 6px;text-align:center;white-space:nowrap;border:1px solid var(--border)">${cyc ? `<span style="display:inline-block;white-space:nowrap;background:${cycColor}1a;color:${cycColor};font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px">${cyc}</span>` : '-'}</td>
          <td class="dg-code" style="padding:5px 8px;font-size:11px;font-family:var(--mono);border:1px solid var(--border)">${it.ticker || ''}</td>
          <td class="dg-name" style="padding:5px 8px;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid var(--border)" title="${esc(it.name)}">${esc(it.name)}</td>
          <td style="padding:5px 8px;font-size:12px;font-weight:600;text-align:right;font-family:var(--mono);border:1px solid var(--border)">${it.amount != null ? Number(it.amount).toLocaleString() : '-'}</td>
          <td style="padding:5px 8px;font-size:11px;font-weight:600;text-align:right;color:${c.color};border:1px solid var(--border)">${it.rate != null && it.rate > 0 ? Number(it.rate).toFixed(2) + '%' : '-'}</td>
          <td style="padding:5px 8px;font-size:11px;font-weight:600;text-align:right;border:1px solid var(--border)">${chgHtml(it, cyc)}</td>
          <td onclick="toggleHide('${it.ticker || ''}')" title="${off ? '숨김 해제' : '이 종목 숨기기'}" style="padding:5px 2px;text-align:center;cursor:pointer;user-select:none;font-size:11px;line-height:1;color:${off ? '#f59e0b' : 'var(--text3)'};border:1px solid var(--border)">${off ? '↩' : '✕'}</td>
        </tr>`}).join('')}</tbody>
      </table></div>`;
    } else if (d.error) {
      body = `<div style="padding:10px 12px;font-size:12px;color:var(--text3)">⚠️ ${d.error}</div>`;
    } else {
      body = `<div style="padding:10px 12px;font-size:12px;color:var(--text3)">${selM}월 공지 종목 없음</div>`;
    }
    return `<div style="background:${c.color}0a;border:1px solid ${c.color}33;border-radius:10px;overflow:hidden">
      <div style="padding:8px 12px;border-bottom:1px solid ${c.color}33;display:flex;align-items:center;gap:6px;background:${c.color}1f">
        <span style="font-weight:700;font-size:13px;color:${c.color}">${c.name}</span>
        <span style="font-size:11px;color:var(--text3)">${c.label}</span>
        <span style="font-size:11px;color:var(--text3);margin-left:auto">${items.length}종목</span>
      </div>${body}
    </div>`;
  });
  let hint = '';
  if (_favOnly && !_fav.size)
    hint += `<div style="padding:8px 10px;margin-bottom:8px;border:1px dashed #f59e0b;border-radius:8px;font-size:12px;color:var(--text3)">★ 표시한 종목이 아직 없습니다. 아래 표의 ☆를 눌러 담으면 그 종목만 보입니다.</div>`;
  if (_showHidden)
    hint += `<div style="padding:8px 10px;margin-bottom:8px;border:1px dashed #64748b;border-radius:8px;font-size:12px;color:var(--text3)">숨긴 종목(흐린 줄)을 함께 보고 있습니다. ↩를 누르면 다시 나옵니다.${_hide.size ? ` <button onclick="clearHidden()" style="margin-left:6px;padding:2px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg2);color:var(--text);font-size:11px;font-weight:700;cursor:pointer">전체 해제</button>` : ''}</div>`;
  grid.innerHTML = hint + `<div class="dist-grid">${cards.join('')}</div>`;
}

// 새로고침 버튼: 페이지 자체를 다시 로드(배포된 새 코드 반영) + 데이터 강제 갱신
function pageRefresh(){
  sessionStorage.setItem('forceRefresh', '1');
  location.reload();
}
// 상단 로고·브라우저 탭 제목 앞에 이번 달 표시 (예: "(7월) ETF 분배금 공지")
(function(){
  const m = new Date().getMonth() + 1;
  document.title = `(${m}월) ETF 분배금 공지`;
  const logo = document.querySelector('.logo');
  if (logo) logo.textContent = `(${m}월) ETF 분배금 공지`;
})();

// 방문자 카운터: 공개 프록시(hitCounter)에 집계. 세션당 1회만 +1(새로고침 중복 방지), 표시는 매 로드.
async function bumpVisitor(){
  const el = document.getElementById('visitCount');
  try {
    const counted = sessionStorage.getItem('visitCounted') === '1';
    const d = await api({ action:'hitCounter', bump: counted ? '0' : '1' });
    sessionStorage.setItem('visitCounted', '1');
    if (el && d && d.count != null) el.textContent = `👁 오늘 ${Number(d.today||0).toLocaleString()} · 누적 ${Number(d.count).toLocaleString()}`;
  } catch(e) { /* 카운터 실패는 페이지에 영향 없음 */ }
}
bumpVisitor();

// ── 탭 메뉴: 한 번에 한 섹션만 표시(모바일서 계속 스크롤 안 하도록) ──
// 인라인 display 대신 .tab-active 클래스만 토글 → 숨김은 모바일 CSS에서만 적용(PC는 전부 표시).
function showSection(name){
  const map = { cal:'.p-cal', notice:'.p-notice', sched:'.p-sched', grid:'#sec-grid' };
  Object.keys(map).forEach(k => {
    const el = document.querySelector(map[k]);
    if (el) el.classList.toggle('tab-active', k === name);
  });
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.sec === name));
  window.scrollTo(0, 0);
}
showSection('cal');

const _force = sessionStorage.getItem('forceRefresh') === '1';
sessionStorage.removeItem('forceRefresh');
loadDistributions(_force);
</script>
