<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV 자막 전송</title>
<style>
:root{font-family:'Malgun Gothic',sans-serif;color:#e9eef6;background:#111820;color-scheme:dark}*{box-sizing:border-box}body{max-width:760px;margin:48px auto;padding:0 24px}h1{font-size:32px;margin-bottom:10px}p{color:#b7c3d2;line-height:1.7}.card{background:#1b2531;border:1px solid #334153;border-radius:14px;padding:24px;margin:20px 0}label{display:block;color:#aebccc;font-size:13px;margin:18px 0 8px}.row{display:flex;gap:10px;align-items:center}.file{flex:1;overflow-wrap:anywhere;font-size:14px;color:#d7e1ed}button,select{font:inherit;padding:11px 16px;border-radius:8px;border:1px solid #4b5c71;background:#2c3b4e;color:white}button{cursor:pointer;white-space:nowrap}button:disabled{opacity:.45;cursor:wait}.primary{background:#9ae2bb;color:#11281d;border:0;font-weight:bold}select{flex:1;min-width:0}progress{width:100%;accent-color:#9ae2bb;margin-top:16px;height:12px}#error{white-space:pre-wrap;overflow-wrap:anywhere;color:#ffb9aa;max-height:180px;overflow:auto;font-size:13px}small{color:#aebccc}#phase{font-size:20px;font-weight:bold}footer{display:flex;justify-content:space-between;gap:10px;align-items:center}.stale{color:#ffc577!important}@media(max-width:540px){body{margin:24px auto}.row{flex-wrap:wrap}.card{padding:18px}}
</style>
<h1>TV 자막 전송</h1><p>컴퓨터의 동영상에 자막을 합쳐 LG TV로 보냅니다.<br>원본 파일은 그대로 보존합니다. 컴퓨터와 TV를 같은 네트워크에 연결해 주세요.</p>
<section class="card">
<label>1. 동영상</label><div class="row"><span id="video" class="file">선택한 파일 없음</span><button id="videoBtn" onclick="choose('video')">동영상 선택</button></div>
<label>2. 자막 파일</label><div class="row"><span id="subtitle" class="file">선택한 파일 없음</span><button id="subBtn" onclick="choose('subtitle')">자막 선택</button></div>
<label>3. 재생할 TV</label><div class="row"><select id="tv"><option value="">먼저 TV 찾기를 눌러주세요</option></select><button id="searchBtn" onclick="request('/discover')">TV 찾기</button></div>
<div class="row" style="margin-top:26px"><button id="playBtn" class="primary" onclick="request('/cast',{index:document.getElementById('tv').value})">자막 합치고 TV에서 재생</button><button onclick="request('/stop')">중지</button></div>
<p style="font-size:13px;margin-bottom:0">처음에는 영상 전체를 변환하므로 준비 시간이 걸립니다. 준비된 영상은 다음에 바로 전송합니다. TV에서 재생하는 동안 이 프로그램을 켜두세요.</p>
</section>
<section class="card"><div class="row" style="flex-wrap:wrap"><button onclick="request('/seek',{delta:-300})">-5분</button><button onclick="request('/seek',{delta:-60})">-1분</button><button onclick="request('/seek',{delta:-10})">-10초</button><span id="pos" style="flex:1;text-align:center;font-weight:bold">--:--</span><button onclick="request('/seek',{delta:10})">+10초</button><button onclick="request('/seek',{delta:60})">+1분</button><button onclick="request('/seek',{delta:300})">+5분</button></div><div class="row" style="margin-top:12px"><input id="jump" placeholder="이동할 시각 (예: 1:23:45)" style="flex:1;min-width:0;font:inherit;padding:11px;border-radius:8px;border:1px solid #4b5c71;background:#111820;color:white"><button onclick="jump()">이동</button></div></section>
<section class="card" aria-live="polite"><div id="phase">연결 중</div><progress id="progress" max="100" value="0"></progress><p id="message"></p><small id="health">프로그램 상태 확인 중</small><br><small id="read">TV 영상 요청: 아직 없음</small><pre id="error"></pre></section>
<footer><small>영상·자막은 외부 서버에 업로드하지 않습니다.</small><button onclick="quit()">프로그램 종료</button></footer>
<script>
const token='__TOKEN__';let last=Date.now(),deviceKey='',pending=false;
async function request(route,data={}){try{const r=await fetch(route,{method:'POST',headers:{'Content-Type':'application/json','X-Cast-Token':token},body:JSON.stringify(data)});const s=await r.json();if(!r.ok)throw Error(s.error);await poll();}catch(e){document.getElementById('error').textContent=e.message;}}
function choose(kind){if(pending)return;const input=document.createElement('input');input.type='file';input.accept=kind==='video'?'.mp4,.mkv,.avi,.mov,.ts,.m4v,.wmv':'.srt,.smi,.ass,.ssa,.vtt';input.onchange=async()=>{const file=input.files[0];if(!file)return;pending=true;try{const r=await fetch('/upload',{method:'POST',headers:{'X-Cast-Token':token,'X-File-Kind':kind,'X-File-Name':encodeURIComponent(file.name)},body:file});const s=await r.json();if(!r.ok)throw Error(s.error);await poll();}catch(e){document.getElementById('error').textContent=e.message;}finally{pending=false;}};input.click();}
function hms(t){t=Math.max(0,Math.floor(t||0));return [Math.floor(t/3600),Math.floor(t/60)%60,t%60].map((n,i)=>String(n).padStart(i?2:1,'0')).join(':');}
function jump(){const p=document.getElementById('jump').value.trim().split(':').map(Number);if(!p.length||p.some(n=>!Number.isFinite(n)))return;request('/seek',{to:p.reduce((a,n)=>a*60+n,0)});}
function time(t){return t?new Date(t).toLocaleTimeString('ko-KR'):'없음';}
async function poll(){try{const r=await fetch('/state',{headers:{'X-Cast-Token':token}});if(!r.ok)throw Error('프로그램 응답 오류');const s=await r.json();last=Date.now();for(const id of ['video','subtitle'])document.getElementById(id).textContent=s[id]||(id==='subtitle'?'없음 (영상만 보냅니다)':'선택한 파일 없음');document.getElementById('phase').textContent=s.phase+(s.phase==='자막 합치는 중'?' '+s.progress+'%':'');document.getElementById('message').textContent=s.message;document.getElementById('progress').value=s.progress;document.getElementById('error').textContent=s.error;const health=document.getElementById('health');health.textContent='프로그램 응답 확인: '+new Date(last).toLocaleTimeString('ko-KR');health.className='';document.getElementById('pos').textContent=s.duration?hms(s.position)+' / '+hms(s.duration):'--:--';document.getElementById('read').textContent='TV 영상 요청: '+time(s.lastRead);const key=JSON.stringify(s.devices);if(key!==deviceKey){deviceKey=key;const select=document.getElementById('tv');select.replaceChildren();if(!s.devices.length){const o=new Option('TV 찾기를 눌러주세요','');select.add(o);}s.devices.forEach((d,i)=>select.add(new Option(d.name,String(i))));}for(const id of ['videoBtn','subBtn','searchBtn','playBtn'])document.getElementById(id).disabled=s.busy;document.getElementById('playBtn').disabled=s.busy||!s.video||!s.devices.length;}catch(e){const h=document.getElementById('health');h.textContent='프로그램 응답 없음 · 마지막 확인 '+new Date(last).toLocaleTimeString('ko-KR');h.className='stale';}}
async function quit(){await request('/quit');document.getElementById('phase').textContent='프로그램 종료';document.getElementById('message').textContent='이 탭을 닫으셔도 됩니다.';clearInterval(timer);}
poll();const timer=setInterval(poll,1500);
</script></html>
