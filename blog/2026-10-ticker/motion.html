<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>시세 위젯 모션</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden}
body{font-family:'Pretendard',sans-serif;position:relative;color:#1a1330;
 background:radial-gradient(1100px 700px at 8% 0%,#fde7f3 0%,transparent 60%),radial-gradient(1200px 800px at 100% 100%,#e0f2fe 0%,transparent 60%),#f4f7ff}
.abs{position:absolute}
#hook{inset:0;display:flex;flex-direction:column;justify-content:center;padding-left:200px;gap:14px}
#hook div{font-weight:800;letter-spacing:-2px;line-height:1.15}
#k1{font-size:64px;color:#5b5bf0}#k2,#k3{font-size:110px}#k3 em{font-style:normal;color:#dc2626}
#cap{left:110px;top:380px;width:760px}
#cap .n{display:inline-block;width:64px;height:64px;line-height:64px;border-radius:50%;background:#5b5bf0;color:#fff;text-align:center;font-weight:800;font-size:36px;margin-bottom:22px}
#cap .t{font-size:72px;font-weight:800;letter-spacing:-2px;line-height:1.2}
#cap .s{font-size:36px;color:#4b5563;margin-top:22px;line-height:1.45}
/* 위젯: 실제 위젯 색·글꼴 그대로 2.4배 */
#wg{left:1010px;top:150px;width:760px;background:#2a2f3a;border-radius:6px;box-shadow:0 30px 80px rgba(20,20,60,.35);padding:14px 22px 18px;color:#e8eaed;overflow:hidden}
#wg .top{display:flex;justify-content:flex-end;color:#7db3ff;font-size:30px;height:40px}
.sep{height:2px;background:#4a5060;margin:8px 0}
.row{display:grid;grid-template-columns:1fr 250px 150px 0px;align-items:center;height:62px;font-size:34px;border-bottom:1px solid #353b48;transition:none}
.row .nm{font-weight:600;white-space:nowrap;overflow:hidden}.row .px,.row .pc,.row .am{font-family:Consolas,monospace;text-align:right;font-size:34px}
.row .am{overflow:hidden;white-space:nowrap}
.up{color:#ff5a5f}.dn{color:#5aa2ff}
.fold{font-size:26px;color:#8a919c;height:44px;line-height:44px;padding-left:6px}
#tab{width:62px;height:62px;background:#5aa2ff;color:#12151c;font-size:34px;text-align:center;line-height:62px;border-radius:4px}
#cur{width:46px;height:46px;pointer-events:none;z-index:9}
#ripple{z-index:8;width:90px;height:90px;border-radius:50%;border:5px solid #5b5bf0;opacity:0}
/* 설정 */
#st{left:1010px;top:170px;width:760px;background:#2a2f3a;border-radius:8px;padding:30px 34px;color:#e8eaed;box-shadow:0 30px 80px rgba(20,20,60,.35);opacity:0}
#st .lb{font-size:26px;color:#8a919c;margin-bottom:16px}
#st .bs{display:flex;gap:14px;margin-bottom:14px}
#st .b{font-size:30px;padding:8px 20px;background:#1f242e;border-radius:4px}
#st .b.on{background:#7db3ff;color:#12151c}
#st .ta{background:#1f242e;font-family:Consolas,monospace;font-size:30px;padding:14px 18px;line-height:1.5;height:430px;overflow:hidden}
#dcap{left:0;width:1920px;top:70px;text-align:center;opacity:0}
#dcap .t{font-size:64px;font-weight:800;letter-spacing:-2px}#dcap .t em{font-style:normal;color:#5b5bf0}
#dcap .s{font-size:34px;color:#4b5563;margin-top:14px}
.mon{top:260px;width:800px;height:500px;border:14px solid #1a1a22;border-radius:14px;overflow:hidden;
 background:linear-gradient(135deg,#3a5fb0,#6a4fa8 60%,#c46aa0);box-shadow:0 30px 60px rgba(20,20,60,.25)}
.mon .tb{position:absolute;left:0;right:0;bottom:0;height:26px;background:#20202a}
.stand{top:774px;width:180px;height:60px;background:linear-gradient(#2a2a33,#1a1a22);clip-path:polygon(30% 0,70% 0,100% 100%,0 100%)}
#mini{width:112px;height:118px;background:#2a2f3a;border-radius:3px;padding:6px 7px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
#mini i{display:block;height:7px;margin:5px 0;border-radius:2px;background:linear-gradient(90deg,#c9ccd3 0 38%,transparent 38% 58%,#c9ccd3 58% 82%,#5aa2ff 82%)}
#mini i.u{background:linear-gradient(90deg,#c9ccd3 0 38%,transparent 38% 58%,#c9ccd3 58% 82%,#ff5a5f 82%)}
#snap{width:160px;height:160px;border-radius:50%;border:8px solid #fff;box-shadow:0 0 30px #fff;opacity:0}
#end{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0}
#end .k{font-size:44px;font-weight:700;color:#4b5563}
#end .ttl{font-size:150px;font-weight:900;letter-spacing:-5px;background:linear-gradient(90deg,#db2777,#7c3aed,#2563eb);-webkit-background-clip:text;color:transparent;margin-top:10px}
#end .tags{margin-top:50px;display:flex;gap:18px}
#end .tags span{font-size:36px;font-weight:700;background:#fff;border:2px solid #e3ddf3;border-radius:999px;padding:14px 34px}
</style></head><body>
<div id="hook" class="abs"><div id="k1">시세 하나 보려고</div><div id="k2">증권사 앱 켜고, 로그인하고…</div><div id="k3">이제 <em>바탕화면</em>에서 봐요</div></div>
<div id="cap" class="abs"><div class="n">1</div><div class="t"></div><div class="s"></div></div>
<div id="wg" class="abs"><div class="top">⚙</div><div id="rows"></div></div>
<div id="tab" class="abs">▶</div>
<div id="st" class="abs"><div class="lb">목록 (한 줄에 하나 · 심볼=이름 · --- 는 구분선)</div>
 <div class="bs"><span class="b" data-k="KOSPI">코스피</span><span class="b" data-k="KOSDAQ">코스닥</span></div>
 <div class="bs"><span class="b" data-k="^GSPC">S&amp;P500</span><span class="b" data-k="^IXIC">나스닥</span><span class="b" data-k="^DJI">다우</span><span class="b" data-k="^SOX">반도체</span></div>
 <div class="ta" id="ta"></div></div>
<div id="ripple" class="abs"></div>
<svg id="cur" class="abs" viewBox="0 0 24 24"><path d="M3 2l17 10-7.5 1.6L9 21z" fill="#1a1330" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
<div id="desk" class="abs" style="inset:0;opacity:0"><div id="dcap" class="abs"><div class="t"></div><div class="s"></div></div>
 <div class="mon abs" style="left:130px"><div class="tb"></div></div><div class="stand abs" style="left:440px"></div>
 <div class="mon abs" style="left:990px"><div class="tb"></div></div><div class="stand abs" style="left:1300px"></div>
 <div id="mini" class="abs"><i></i><i></i><i class="u"></i><i></i><i></i><i class="u"></i><i></i><i></i></div><div id="snap" class="abs"></div></div>
<div id="end" class="abs"><div class="k">무료 · 회원가입 없음 · 파일 하나</div><div class="ttl">바탕화면 시세 위젯</div>
 <div class="tags"><span>국내 주식·ETF</span><span>미국 주식·지수</span><span>환율</span><span>코인</span></div></div>
<script>
// 값은 2026-10-30 장중 실제 위젯 캡처에서 가져온 예시(종목 추천 아님)
const G=[[['코스피',5629,-5.20,-309,0],['S&P500',7720.39,-0.30,-23.59,2],['나스닥',26184.72,-1.38,-365.13,2],['환율',1338.28,-0.05,-0.71,2]],
 [['삼성전자',218250,-5.93,-13750,0],['코덱스200',89195,-5.58,-5270,0],['TIGER 미국배당',15200,1.64,245,0]],
 [['SCHD',35.93,2.39,0.84,2],['NVDA',208.08,-3.39,-7.30,2],['비트코인',104578000,-3.83,-4165000,0]]];
const T_END=32;
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), ease=x=>{x=cl(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}, seg=(t,a,b)=>ease((t-a)/(b-a));
const fmt=(v,d)=>v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const $=id=>document.getElementById(id);
function wiggle(v,d,t,i){ if(d===0&&v<1000) return v; const step=d?0.01*Math.max(1,Math.round(v/2000)):Math.max(5,Math.round(v/20000/5)*5); return v+step*Math.round(Math.sin(t*1.7+i*2.1)*2+Math.sin(t*0.9+i)*1.4); }
function drawWidget(t,detail,fold){
  let h='',i=0;
  G.forEach((g,gi)=>{ if(gi) h+='<div class="sep"></div>';
    if(gi===2&&fold>0.98){h+='<div class="fold">▸ SCHD 외 2</div>';return}
    const hh=gi===2?(1-fold):1;
    h+='<div style="height:'+(62*g.length*hh)+'px;overflow:hidden">';
    g.forEach(r=>{ i++; const px=wiggle(r[1],r[4],t,i), c=r[2]>=0?'up':'dn';
      h+='<div class="row" style="grid-template-columns:1fr 250px 150px '+(200*detail)+'px"><span class="nm">'+r[0]+'</span><span class="px">'+fmt(px,r[4])+'</span><span class="pc '+c+'">'+(r[2]>0?'+':'')+r[2].toFixed(2)+'%</span><span class="am '+c+'">'+(r[3]>0?'+':'')+fmt(r[3],r[4])+'</span></div>'});
    h+='</div>'});
  $('rows').innerHTML=h;
  $('wg').style.width=(760+200*detail)+'px';
}
function cap(n,t1,s){const c=$('cap');c.querySelector('.n').textContent=n;c.querySelector('.t').innerHTML=t1;c.querySelector('.s').innerHTML=s}
function cursor(x,y,click){ $('cur').style.left=x+'px';$('cur').style.top=y+'px';
  const r=$('ripple'); r.style.left=(x-45)+'px';r.style.top=(y-45)+'px'; r.style.opacity=click>0&&click<1?(1-click):0; r.style.transform='scale('+(0.4+click*1.2)+')'; }
const P0=[1950,620];
function path(t,pts){ // pts: [time,x,y], 사이를 부드럽게
  for(let i=1;i<pts.length;i++) if(t<=pts[i][0]){const a=pts[i-1],b=pts[i],k=seg(t,a[0],b[0]);return [a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k]}
  return pts[pts.length-1].slice(1);
}
function renderMain(t,shifted){
  // 0~3.2 첫 문장
  const hk=shifted?0:(t<3.2?1:1-seg(t,3.2,3.7)); $('hook').style.opacity=hk;
  ['k1','k2','k3'].forEach((k,i)=>{const a=seg(t,0.2+i*0.8,0.8+i*0.8);$(k).style.opacity=a;$(k).style.transform='translateY('+(30*(1-a))+'px)'});
  // 위젯 등장 3.6~4.4, 숨기기 15~16.2, 다시 17~17.8, 설정으로 18.8~
  let wx=1010+(1-seg(t,3.6,4.4))*1000;
  const hide=seg(t,15.2,16)-seg(t,17,17.8); wx+=hide*1000;
  const wgOn=t>3.5&&t<19; $('wg').style.display=wgOn?'block':'none'; $('wg').style.left=wx+'px';
  $('wg').style.opacity=1-seg(t,18.6,19);
  const detail=seg(t,8.2,8.7)-seg(t,10.6,11);
  const fold=seg(t,12.4,12.9);
  drawWidget(t,detail,fold); wx-=200*detail; $('wg').style.left=wx+'px';
  // ▶ 단추: 위젯 오른쪽 위 바깥
    $('tab').style.display=t>4.4&&t<18.6?'block':'none';
  $('tab').style.left=(hide>0?1920-62-40:wx+760-62)+'px'; $('tab').style.top='82px';
  $('tab').textContent=hide>0.5?'◀':'▶';
  // 설명 글
  let cn=0;
  if(t>4.4&&t<7.6){cn=1;cap('2','지금 시세가<br>계속 바뀌어요','5초마다 새로 받아요.<br>오르면 빨강, 내리면 파랑')}
  else if(t>=7.6&&t<11.6){cn=1;cap('3','누르면<br>오늘 얼마 변했는지','한 번 더 누르면 접혀요')}
  else if(t>=11.6&&t<14.6){cn=1;cap('4','묶음째<br>접어 둘 수 있어요','안 볼 때는 한 줄로')}
  else if(t>=14.6&&t<18.4){cn=1;cap('5','▶ 하나로 숨기고<br>◀ 로 다시','화면 가릴 때 편해요')}
  else if(t>=19.2&&t<23){cn=1;cap('6','지수는<br>버튼으로 넣고 빼요','코드 외울 필요 없어요')}
  const capA=cn? Math.min(seg(t,[4.4,7.6,11.6,14.6,19.2].filter(x=>x<=t).pop(),[4.4,7.6,11.6,14.6,19.2].filter(x=>x<=t).pop()+0.4),1):0;
  $('cap').style.opacity=capA; $('cap').style.transform='translateY('+(20*(1-capA))+'px)';
  // 설정창 19~23
  const stA=seg(t,19,19.4)-seg(t,22.8,23.2); $('st').style.opacity=stA; $('st').style.display=stA>0?'block':'none';
  const on={KOSPI:1,'^GSPC':1,'^IXIC':1,KOSDAQ:t>20.4,'^DJI':t>21.2,'^IXIC_off':t>22};
  let lines=['USDKRW=X=환율','---','005930=삼성전자','069500=코덱스200','---','SCHD'];
  const add=[]; if(on.KOSPI)add.push('KOSPI=코스피'); if(on.KOSDAQ)add.unshift('KOSDAQ=코스닥'); if(on['^DJI'])add.unshift('^DJI=다우');
  if(!on['^IXIC_off'])add.push('^IXIC=나스닥'); add.push('^GSPC=S&P500');
  $('ta').innerHTML=add.concat(lines).join('<br>');
  document.querySelectorAll('#st .b').forEach(b=>{const k=b.dataset.k; b.classList.toggle('on', k==='^IXIC'?!on['^IXIC_off']:!!on[k])});
  // 커서
  const pts=[[0,...P0],[7.2,...P0],[8,1500,330],[10.3,1500,330],[10.6,1500,330],[12,1400,672],[12.4,1400,672],[14.6,1500,600],[15.1,1745,112],[16.6,1820,300],[16.9,1849,112],[18.6,1849,112],[19.6,1700,700],[20.2,1235,272],[21,1383,336],[21.8,1262,336],[23,1950,700]];
  const [cx,cy]=path(t,pts);
  const clicks=[8.1,10.5,12.3,15.1,16.95,20.3,21.1,21.9];
  let ck=0; clicks.forEach(c=>{if(t>=c&&t<c+0.5)ck=(t-c)/0.5});
  $('cur').style.display=t>7&&t<23.2?'block':'none'; cursor(cx,cy,ck);
  // 끝
  const ea=seg(t,23.2,23.8); $('end').style.opacity=ea; $('end').style.transform='scale('+(0.96+0.04*ea)+')';
};
// 바탕화면 장면(3.7~9.7): 실제 위젯처럼 모니터 사이를 끌고, 가장자리 SNAP 안에 들어오면 착 붙는다(ticker.pyw move)
function desk(s){
  const on=seg(s,0,0.5)-seg(s,5.6,6); $('desk').style.opacity=on;
  const T=$('dcap').querySelector('.t'), S=$('dcap').querySelector('.s');
  if(s<2.2){T.innerHTML='바탕화면 구석에 <em>작게</em>';S.textContent='다른 일 하면서 곁눈으로'}
  else{T.innerHTML='모니터 사이로 끌고, 가장자리엔 <em>자석처럼 착</em>';S.textContent='듀얼 모니터 어디든 놓을 수 있어요'}
  $('dcap').style.opacity=seg(s,0.3,0.8)*(s<2.0||s>2.3?1:0.2)-seg(s,5.6,6);
  // 왼쪽 모니터 화면 안쪽: x 144~916, y 274~734(작업표시줄 위). 오른쪽: x 1004~1776
  const L0=[916-112-6,734-26-118-6], grab=[ -60,-40 ];
  let x=L0[0],y=L0[1],snap=0;
  const drag=seg(s,1.6,3.6);           // 끌어서 오른쪽 모니터 안쪽(가장자리에서 조금 떨어진 곳)까지
  const mid=[1560,520];
  if(s>=1.6){x=L0[0]+(mid[0]-L0[0])*drag;y=L0[1]+(mid[1]-L0[1])*drag-Math.sin(drag*Math.PI)*80}
  // 3.6~4.4 오른쪽 아래로 천천히 → 가장자리 30px 안에 들면 순간 이동
  if(s>=3.6){const k=seg(s,3.6,4.4); const tx=1776-112-18, ty=734-26-118-20; x=mid[0]+(tx-mid[0])*k; y=mid[1]+(ty-mid[1])*k;
    if(s>=4.25){x=1776-112;y=734-26-118;snap=seg(s,4.25,4.8)}}
  $('mini').style.left=x+'px';$('mini').style.top=y+'px';
  $('mini').style.boxShadow=s>1.5&&s<4.25?'0 18px 30px rgba(0,0,0,.45)':'0 6px 16px rgba(0,0,0,.4)';
  const sn=$('snap'); sn.style.left=(1776-80)+'px'; sn.style.top=(734-26-80)+'px';
  sn.style.opacity=snap>0&&snap<1?(1-snap):0; sn.style.transform='scale('+(0.3+snap)+')';
  const cx=s<1.6? 1950+(x+60-1950)*seg(s,0.6,1.5) : x+60, cy=s<1.6? 700+(y+30-700)*seg(s,0.6,1.5) : y+30;
  $('cur').style.display=s>0.6&&s<5.4?'block':'none'; cursor(cx,cy,s>1.5&&s<1.9?(s-1.5)/0.4:0);
}
window.render=function(t){
  const inDesk=t>=3.7&&t<9.7;
  if(t<3.7) renderMain(t,false); else if(!inDesk) renderMain(t-6,true);
  else { renderMain(0,true); $('hook').style.opacity=0; $('k1').style.opacity=0; }
  $('desk').style.display=inDesk?'block':'none';
  if(inDesk) desk(t-3.7);
};
render(+(new URLSearchParams(location.search).get('t')||0));
if(location.search.includes('play')){const s=performance.now();(function f(){render(((performance.now()-s)/1000)%T_END);requestAnimationFrame(f)})()}
</script></body></html>
