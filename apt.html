<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>의정부 아파트 시세</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 앱(m.html)과 같은 색. 회색(--text3)은 '아직 신고가 덜 된 값'에만 쓴다(screens.md) */
  :root { --bg:#f4f7ff; --card:#fff; --border:#e3ddf3; --text:#1a1330; --text2:#4b5563; --text3:#9ca3af;
          --accent:#5b5bf0; --green:#059669; --red:#dc2626; --up:#dc2626; --down:#2563eb; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Pretendard Variable',Pretendard,system-ui,sans-serif; font-size:14px; line-height:1.45; }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 16px;
           background:linear-gradient(100deg,#fff0f7,#eef1ff 50%,#e9fff6); border-bottom:1px solid var(--border); }
  header h1 { margin:0; font-size:16px; }
  header a { color:var(--accent); text-decoration:none; font-size:13px; }
  main { max-width:980px; margin:0 auto; padding:12px 16px 40px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:14px; }
  .card h2 { margin:0 0 4px; font-size:15px; }
  .sub { color:var(--text2); font-size:12px; margin-bottom:10px; }
  .alive { font-size:12px; color:var(--text2); }
  .alive.bad { color:#fff; background:var(--red); padding:6px 10px; border-radius:8px; display:block; margin-bottom:10px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  table { table-layout:auto; }
  th, td { padding:6px 4px; border-bottom:1px solid var(--border); text-align:right; white-space:nowrap; }
  td.wr, th.wr { white-space:normal; }
  .cx table td, .cx table th { white-space:normal; padding:5px 3px; }
  @media (max-width:420px) { th, td { padding:5px 2px; font-size:12.5px; } }
  @media (max-width:360px) { main { padding:10px 10px 30px; } .card { padding:10px; } .cx { padding:8px; } th, td { padding:4px 1px; font-size:11.5px; } }
  th { font-size:12px; color:var(--text2); font-weight:600; }
  th:first-child, td:first-child { text-align:left; }
  tbody tr:last-child td { border-bottom:1px solid var(--border); }
  .wrap { overflow-x:visible; }
  .up { color:var(--up); } .down { color:var(--down); } .pend { color:var(--text3); }
  .tag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:6px; background:#eef1ff; color:var(--accent); margin-left:4px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr)); gap:10px; }
  .cx { min-width:0; }
  .cx { border:1px solid var(--border); border-radius:10px; padding:10px; }
  .cx .nm { font-weight:700; } .cx .meta { font-size:12px; color:var(--text2); }
  .big { font-size:18px; font-weight:700; }
  .row { display:flex; justify-content:space-between; gap:8px; font-size:13px; }
  tr.sel td { background:#f3f0ff; } tr.click { cursor:pointer; }
  svg { width:100%; height:auto; display:block; }
  details summary { cursor:pointer; color:var(--accent); font-size:13px; margin-top:6px; }
  /* 동 지도: 올리면 그 동만 종이처럼 떠오르고, 누르면 확대 + 대장 단지 지시선·말풍선 */
  #map { height:min(70vh,600px); background:#f8f7ff; border-radius:10px; touch-action:manipulation; }
  @media (max-width:639px) { #map { height:560px; } }
  #map .dong { stroke:#fff; stroke-width:1.5; vector-effect:non-scaling-stroke; cursor:pointer; transform-box:fill-box; transform-origin:center;
               transition:transform .18s ease, filter .18s ease, opacity .25s ease; outline:none; }
  #map .dong { fill-opacity:.72; }
  #mapTiles { filter:saturate(.45) brightness(1.04); }
  #map.hov .dong, #map.zoom .dong { opacity:.4; }
  #map .dong.on { fill-opacity:.1; }   /* 누른 동은 속이 비쳐 배경 지도(길·지명)가 보이게 */
  #map .dong.hot { opacity:1; transform:translateY(-1.5%) scale(1.03); filter:drop-shadow(0 6px 8px rgba(40,30,120,.35)); }
  #map .dong.on { opacity:1; stroke:var(--accent); stroke-width:2.5; }
  #map .dong:focus-visible { stroke:var(--text); stroke-width:3; }
  #map .lbl { pointer-events:none; text-anchor:middle; font-weight:700; transition:opacity .2s; }
  #map.zoom .lbl { opacity:0; }
  #map .call { opacity:0; transition:opacity .25s ease .05s; } #map .call.in { opacity:1; }
  #map .call div { box-sizing:border-box; height:100%; background:#fff; border:1px solid var(--accent); border-radius:.8em; padding:.45em .7em; line-height:1.35; overflow:hidden; }
  #map .call b { font-size:1.08em; } #map .call .m { color:var(--text2); }
  #map .call table.sz { width:100%; border-collapse:collapse; margin:.15em 0; } #map .call div > span, #map .call div > b:first-child { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } #map .call table.sz td { padding:0 .4em 0 0; border:0; white-space:nowrap; font-size:.95em; line-height:1.4; } #map .call table.sz b { font-size:1em; }
  .mapbar { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:28px; }
  .mapbar button { font:inherit; font-size:13px; color:var(--accent); background:#eef1ff; border:0; border-radius:8px; padding:4px 10px; cursor:pointer; }
  @media (prefers-reduced-motion:reduce) { #map .dong, #map .call, #map .lbl { transition:none; } }
</style>
</head>
<body>
<header><h1>의정부 아파트 시세</h1><a href="m.html">← 포트폴리오</a></header>
<main id="main"><div class="card">불러오는 중…</div></main>
<script>
const API = 'https://script.google.com/macros/s/AKfycbwJS1Fd-sDCVKPLJEpEWZmPQEKAOR9pG7y-nPKZOYty65j3ArOmlDzNX2WFqiGNF_s/exec';
const PY = 3.3058;   // ㎡ → 평
// 분양 평형(공급면적) 어림 — 국토부 자료엔 전용면적만 있다. 공급/전용 1.28 = 알림 단지 두 곳(전용 75.4㎡=29평형, 99㎡=38평형)에서 잡은 비율
function supPy(a) { return Math.round(a * 1.28 / PY); }
// 알림 단지(Code.gs APT_WATCH 와 같게): 단지, 전용㎡ 범위, 이름
const WATCH = [['신일유토빌플러스', 75.4, 75.7, '신일유토빌플러스 29평형'], ['서초한빛삼성', 99, 99.2, '서초한빛삼성 38평형']];
// 동별 대장 단지 — 2026-10-27 사용자: 역이 아니라 동 기준. 최근 1년 거래 LEAD_MIN건 이상 단지 중 2년 평당 중앙값이
// 그 동 1위의 LEAD_PCT 이상인 단지, 많아도 LEAD_MAX 곳(사용자 지정: 1위의 80%·5건·8곳)
// 지도는 행정동 경계(apt_dong.json, vuski/admdongkor 2026-10 판 단순화)이고, 단지는 서버가 지번으로 찾은 좌표(xy)로 그 안에 넣는다
const LEAD_MIN = 5, LEAD_PCT = 0.8, LEAD_MAX = 8;
let T = [], XY = {}, DONG = [], selUmd = null;

function won(p) { const e = Math.floor(p / 10000), r = p % 10000; return e ? e + '억' + (r ? ' ' + r.toLocaleString() : '') : r.toLocaleString() + '만'; }
function pyeong(t) { return t[7] / t[4] * PY; }   // 평당 만원
function med(a) { if (!a.length) return null; const s = a.slice().sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
function pct(a, b) { if (a == null || b == null || !b) return '<span class="pend">–</span>'; const v = (a / b - 1) * 100; return '<span class="' + (v > 0.05 ? 'up' : v < -0.05 ? 'down' : '') + '">' + (v > 0 ? '+' : '') + v.toFixed(1) + '%</span>'; }
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(s, n) { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); }
function monday(s) { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); }
const TODAY = ymd(new Date()), PEND = addDays(TODAY, -30);   // 계약 후 30일 안 신고 → 최근 30일은 덜 찼다

async function api(p) {
  const url = API + '?' + new URLSearchParams(p);   // getApt 는 공개 액션(국토부 공개 자료뿐)
  let last;
  for (let i = 0; i < 3; i++) {
    try { const r = await fetch(url, { redirect: 'follow' }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
    catch (e) { last = e; await new Promise(r => setTimeout(r, 1500)); }
  }
  throw last;
}
async function load() {
  let r;
  try { r = await api({ action: 'getApt' }); }
  catch (e) { document.getElementById('main').innerHTML = '<div class="card" style="color:var(--red)">서버 응답 없음 — 잠시 뒤 새로고침해 주세요 (' + e.message + ')</div>'; return; }
  if (!r.success) { document.getElementById('main').innerHTML = '<div class="card" style="color:var(--red)">' + (r.error || '오류') + '</div>'; return; }
  T = r.trades; XY = r.xy || {};
  try { DONG = await (await fetch('apt_dong.json')).json(); } catch (e) { DONG = []; }
  render(r);
}

function render(r) {
  const at = r.at ? new Date(r.at) : null, ageH = at ? (Date.now() - at) / 36e5 : 999;
  const fmt = at ? at.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '없음';
  const alive = (ageH > 30 || r.err)
    ? '<span class="alive bad">⚠ 갱신이 멈췄습니다 — 마지막 갱신 ' + fmt + (r.err ? ' · ' + r.err : '') + '</span>'
    : '<span class="alive">국토부 실거래(계약일 기준) · 마지막 갱신 ' + fmt + ' · 매일 아침 7시 40분</span>';
  document.getElementById('main').innerHTML = '<div class="card">' + alive + '</div>' + watchHtml() + mapHtml() + umdHtml();
  initMap(); drawChart();
}

// 면적 표시: 전용㎡(전용 평). 사람들이 말하는 'OO평형'은 공급면적이라 전용 평보다 크다(29평형 = 전용 22.8평)
function ar(a, br) { return a.toFixed(1) + '㎡' + (br ? '<br>' : '') + '(' + (a / PY).toFixed(1) + '평)'; }
const NODONG = '<span title="국토부 원본에 동이 비어 있음">–</span>';

// ① 알림 단지: 같은 평형 거래 + 거래가 드물면 같은 단지 다른 평형의 ㎡당 가격으로 본 참고 추정가
function watchHtml() {
  return WATCH.map(([apt, lo, hi, label]) => {
    const rows = T.filter(t => t[2] === apt && t[4] >= lo && t[4] <= hi).sort((a, b) => a[6] < b[6] ? 1 : -1);
    const area = rows.length ? rows[0][4] : (lo + hi) / 2;
    const y1 = addDays(TODAY, -365), y2 = addDays(TODAY, -730), m6 = addDays(TODAY, -183);
    const now = rows.filter(t => t[6] >= y1).map(t => t[7]), ago = rows.filter(t => t[6] >= y2 && t[6] < y1).map(t => t[7]);
    const other = T.filter(t => t[2] === apt && (t[4] < lo || t[4] > hi) && t[6] >= m6);
    const est = other.length ? med(other.map(t => t[7] / t[4])) * area : null;
    const blank = rows.some(t => !t[3]);
    const body = rows.slice(0, 20).map(t => '<tr><td>' + t[6] + (t[6] >= PEND ? ' <span class="tag">신고 중</span>' : '') + '</td><td>' + (t[3] ? t[3] + '동' : NODONG) + '</td><td>' + t[5] + '층</td><td>' + won(t[7]) + '</td></tr>').join('');
    return '<div class="card"><h2>' + label + ' <span style="font-weight:400;font-size:13px">전용 ' + ar(area) + '</span></h2>'
      + '<div class="sub">' + (now.length ? '최근 1년 ' + now.length + '건, 중앙값 ' + won(Math.round(med(now))) + ' · 그 전 1년 대비 ' + pct(med(now), med(ago)) : '최근 1년 이 평형 거래 없음' + (rows[0] ? ' — 마지막 ' + rows[0][6] + ' ' + won(rows[0][7]) : ''))
      + (est ? '<br>참고 추정가 <b>' + won(Math.round(est / 100) * 100) + '</b> = 같은 단지 다른 평형 최근 6개월 거래 ' + other.length + '건의 ㎡당 가격 × ' + area.toFixed(1) + '㎡' : '')
      + '<br>같은 평형 새 신고가 들어오면 텔레그램으로 알림(비슷한 층은 ⭐)</div>'
      + '<div class="wrap"><table><thead><tr><th>계약일</th><th>동</th><th>층</th><th>가격</th></tr></thead><tbody>' + (body || '<tr><td colspan="4">거래 없음</td></tr>') + '</tbody></table></div>'
      + (blank ? '<div class="sub" style="margin:6px 0 0">동 칸 – = 국토부 원본에 동이 비어 있는 거래(신고 때 동을 안 적은 경우). 원본에 채워지면 다음 갱신 때 자동으로 채워집니다.</div>' : '') + '</div>';
  }).join('');
}

// ② 동 지도: 올리면 그 동이 떠오르고, 누르면 확대돼 대장 단지(최근 1년 LEAD_MIN건↑ 중 평당가가 그 동 1위의 80%↑, 최대 8곳)에 지시선·말풍선
const MW = 1000;
let B, MH, VIEW, mapSel = null;
function inRing(x, y, r) { let c = false; for (let i = 0, j = r.length - 1; i < r.length; j = i++) if ((r[i][1] > y) !== (r[j][1] > y) && x < (r[j][0] - r[i][0]) * (y - r[i][1]) / (r[j][1] - r[i][1]) + r[i][0]) c = !c; return c; }
function dongOf(lat, lng) { const d = DONG.find(d => d.p.some(r => inRing(lng, lat, r))); return d ? d.n : null; }
// 경계선 20m 안쪽 단지는 단순화한 경계 탓에 옆 동에 잘못 들 수 있다(롯데캐슬골드파크1단지·동화: 법정동 의정부동인데 호원2동, 경계까지 15m).
// 그 법정동 단지가 거의 없는 동(2곳↓)에 들었으면, 20m 안에 있는 그 법정동 단지가 많은(3곳↑) 동으로 옮긴다.
function ringDist(x, y, r) { let b = 1e9; for (let i = 0, j = r.length - 1; i < r.length; j = i++) { const dx = r[i][0] - r[j][0], dy = r[i][1] - r[j][1], t = Math.max(0, Math.min(1, ((x - r[j][0]) * dx + (y - r[j][1]) * dy) / (dx * dx + dy * dy || 1))); b = Math.min(b, Math.hypot(x - r[j][0] - t * dx, y - r[j][1] - t * dy)); } return b * 90000; }   // 대략 m(의정부 위도)
let _bdCnt = null;   // 법정동 → { 행정동: 단지 수 }
function fixEdge(k, d) {
  if (!_bdCnt) { _bdCnt = {}; for (const kk in XY) { const b = kk.split('|')[1], h = dongOf(XY[kk][0], XY[kk][1]); if (h) (_bdCnt[b] = _bdCnt[b] || {})[h] = (_bdCnt[b][h] || 0) + 1; } }
  const c = _bdCnt[k.split('|')[1]] || {}; if (!d || c[d] > 2) return d;
  const [lat, lng] = XY[k], near = DONG.filter(o => o.n !== d && (c[o.n] || 0) >= 3).map(o => ({ n: o.n, m: Math.min(...o.p.map(r => ringDist(lng, lat, r))) })).sort((a, b) => a.m - b.m)[0];
  return near && near.m <= 20 ? near.n : d;
}
const _hd = {};   // 거래 → 지도와 같은 행정동(좌표 없는 단지는 null)
function hdong(t) { const k = t[0] + '|' + t[1] + '|' + t[2]; if (!(k in _hd)) _hd[k] = XY[k] ? fixEdge(k, dongOf(XY[k][0], XY[k][1])) : null; return _hd[k]; }
// 웹 지도(메르카토르) 좌표 — 배경 지도 타일과 동 경계가 정확히 겹치게. mx·my = 세계 0~1
const mxOf = lng => (lng + 180) / 360, myOf = lat => { const s = Math.sin(lat * Math.PI / 180); return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI); };
function P(lng, lat) { return [(mxOf(lng) - B.mx0) * B.W, (myOf(lat) - B.my0) * B.W]; }
// 배경 지도: OpenStreetMap 기본 타일(CARTO 는 2026-10 기준 열쇠가 있어야 해서 'API KEY REQUIRED' 가 찍혔다).
// 지금 보이는 범위·확대 정도에 맞는 타일만 깐다(화면 1px ≈ 타일 1px). 색은 CSS 로 눌러 앱 색과 맞춘다
function tiles() {
  const svg = document.getElementById('map'), g = document.getElementById('mapTiles'); if (!svg || !g) return;
  const k = VIEW[2] / (svg.clientWidth || 1), z = Math.max(10, Math.min(18, Math.round(Math.log2(B.W / (256 * k))))), n = 2 ** z, sz = B.W / n;
  const tx = v => Math.floor((v / B.W + B.mx0) * n), ty = v => Math.floor((v / B.W + B.my0) * n);
  let h = '';
  for (let x = tx(VIEW[0]); x <= tx(VIEW[0] + VIEW[2]); x++) for (let y = ty(VIEW[1]); y <= ty(VIEW[1] + VIEW[3]); y++)
    h += '<image href="https://tile.openstreetmap.org/' + z + '/' + x + '/' + y + '.png" x="' + ((x / n - B.mx0) * B.W).toFixed(2) + '" y="' + ((y / n - B.my0) * B.W).toFixed(2) + '" width="' + (sz + 0.05).toFixed(3) + '" height="' + (sz + 0.05).toFixed(3) + '"/>';
  g.innerHTML = h;
}
function mapData() {
  const all = DONG.flatMap(d => d.p.flat()), xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  B = { mx0: mxOf(Math.min(...xs)), my0: myOf(Math.max(...ys)) };
  B.W = MW / (mxOf(Math.max(...xs)) - B.mx0); MH = (myOf(Math.min(...ys)) - B.my0) * B.W;
  const m12 = addDays(TODAY, -365), cx = {};   // 단지 키 'sgg|umd|apt' → { dong, xy, trades }
  T.forEach(t => {
    if (t[0] !== '41150' || t[6] < Y2) return;
    const k = t[0] + '|' + t[1] + '|' + t[2], xy = XY[k];
    if (!xy) return;
    (cx[k] = cx[k] || { k: k, apt: t[2], xy: xy, dong: hdong(t), tr: [] }).tr.push(t);
  });
  const byDong = {};
  Object.values(cx).forEach(c => { c.ppy = med(c.tr.map(pyeong)); c.n1 = c.tr.filter(t => t[6] >= m12).length; if (c.dong) (byDong[c.dong] = byDong[c.dong] || []).push(c); });
  DONG.forEach(d => {
    const cs = byDong[d.n] || [];
    d.ppy = med(cs.flatMap(c => c.tr.map(pyeong)));
    const ok = cs.filter(c => c.n1 >= LEAD_MIN).sort((a, b) => b.ppy - a.ppy);
    d.cs = cs; d.lead = ok.filter(c => c.ppy >= (ok[0] || c).ppy * LEAD_PCT).slice(0, LEAD_MAX);
    const r = d.p.reduce((a, b) => a.length > b.length ? a : b).map(q => P(q[0], q[1]));
    let A = 0, X = 0, Y = 0;
