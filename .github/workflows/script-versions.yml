# Apps Script **버전 개수**를 세어 앱 머리글에 띄우는 통로.
#
# 왜 필요한가: 버전이 200개를 채우면 `clasp deploy` 가 통째로 막히는데(2026-09-21 실제로 걸림),
# 버전을 지우는 API 가 없어 사람이 편집기에서 지워야 한다. 막힌 뒤에 알면 그날 배포를 못 한다.
# 그래서 매일 + 배포 직후 개수를 세어 script_versions.json 으로 커밋하고,
# portfolio.html 머리글이 그 파일을 읽어 "GAS 버전 173/200" 으로 보여준다.
# 190개를 넘으면 이 실행을 실패로 끝내 GitHub 가 메일을 보내고, 카톡(runMaint sendKakaoMemo)도 보낸다.
#
# 토큰: deploy.yml 과 같은 CLASPRC_JSON Secret(2.x·3.x 형식 모두 처리). ⛔ 값은 절대 출력하지 않는다.
name: script-versions

on:
  schedule:
    - cron: '17 0 * * *'          # 매일 09:17 KST
  workflow_run:
    workflows: [deploy]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 버전 개수 세기
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          SID=$(jq -r .scriptId .clasp.json)
          printf '%s' "$CLASPRC" > /tmp/rc.json
          # 2.x: {token:{refresh_token}, oauth2ClientSettings:{clientId,clientSecret}}
          # 3.x: {tokens:{default:{client_id,client_secret,refresh_token}}}
          CID=$(jq -r '.oauth2ClientSettings.clientId // .tokens.default.client_id' /tmp/rc.json)
          CSEC=$(jq -r '.oauth2ClientSettings.clientSecret // .tokens.default.client_secret' /tmp/rc.json)
          RT=$(jq -r '.token.refresh_token // .tokens.default.refresh_token' /tmp/rc.json)
          rm -f /tmp/rc.json
          AT=$(curl -s https://oauth2.googleapis.com/token -d client_id="$CID" -d client_secret="$CSEC" \
                 -d refresh_token="$RT" -d grant_type=refresh_token | jq -r .access_token)
          echo "::add-mask::$AT"
          if [ -z "$AT" ] || [ "$AT" = "null" ]; then echo "::error::액세스 토큰 발급 실패"; exit 1; fi
          N=0; PT=''
          while :; do
            R=$(curl -s -H "Authorization: Bearer $AT" \
                  "https://script.googleapis.com/v1/projects/$SID/versions?pageSize=50${PT:+&pageToken=$PT}")
            if echo "$R" | jq -e .error >/dev/null; then echo "$R" | jq .error; exit 1; fi
            N=$((N + $(echo "$R" | jq '.versions | length // 0')))
            PT=$(echo "$R" | jq -r '.nextPageToken // empty')
            [ -z "$PT" ] && break
          done
          echo "버전 $N / 200"
          echo "N=$N" >> "$GITHUB_ENV"
          printf '{"count":%s,"max":200,"checkedAt":"%s"}\n' "$N" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > script_versions.json

      - name: 커밋
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add script_versions.json
          git commit -qm "Apps Script 버전 수 ${N}/200" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done

      - name: 190개 넘으면 경고
        if: ${{ env.N >= 190 }}
        env:
          TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          MSG="⚠️ Apps Script 버전 ${N}/200 — 200이면 배포가 막힙니다. 편집기 🕐프로젝트 기록 → 버전 일괄 삭제: https://script.google.com/d/1yYeK3W1aHUYd6ok9N-dvt0YRmbB4pxX7AL0kMmZBS4-qFpRxHNASUJvG/edit"
          curl -sL -o /dev/null -G --max-time 120 --data-urlencode action=runMaint --data-urlencode fn=sendKakaoMemo \
            --data-urlencode "arg=$MSG" --data-urlencode "token=$TOKEN" \
            'https://script.google.com/macros/s/AKfycbwJS1Fd-sDCVKPLJEpEWZmPQEKAOR9pG7y-nPKZOYty65j3ArOmlDzNX2WFqiGNF_s/exec' || true
          echo "::error::$MSG"; exit 1
