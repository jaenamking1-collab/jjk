# IRP 펀드 기준가를 매일 FunETF 에서 받아 주식상황 G열에 반영한다(Code.gs updateFundNav).
# 왜 Actions 인가: FunETF 가 Apps Script(구글 서버)를 403 으로 막는다(2026-09-30 확인).
# 같은 기준일은 두 번 반영하지 않으므로 두 번 돌거나 재시도해도 안전하다.
name: fund_nav

on:
  schedule:
    - cron: '30 1 * * 1-5'   # 평일 10:30 KST
    - cron: '30 6 * * 1-5'   # 평일 15:30 KST (아침에 기준가가 늦게 나온 날 따라잡기)
  workflow_dispatch:

jobs:
  fund_nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 기준가 받기
        id: nav
        run: echo "arg=$(python3 .github/scripts/fundnav.py)" >> "$GITHUB_OUTPUT"
      - name: updateFundNav 호출
        env:
          ARG: ${{ steps.nav.outputs.arg }}
          TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          set -euo pipefail
          echo "기준가: $ARG"
          BASE='https://script.google.com/macros/s/AKfycbwJS1Fd-sDCVKPLJEpEWZmPQEKAOR9pG7y-nPKZOYty65j3ArOmlDzNX2WFqiGNF_s/exec'
          code=000
          for try in 1 2 3; do
            code=$(curl -sL -o /tmp/r.json -w '%{http_code}' --max-time 340 -G \
                     --data-urlencode "action=runMaint" --data-urlencode "fn=updateFundNav" \
                     --data-urlencode "arg=$ARG" --data-urlencode "token=$TOKEN" "$BASE") || true
            if [ "$code" = "200" ]; then break; fi
            sleep 10
          done
          echo "HTTP $code"
          python3 -c "import json,sys;d=json.load(open('/tmp/r.json'));print('\n'.join(d.get('log') or []));print(d.get('error') or '');sys.exit(0 if d.get('success') else 1)"
