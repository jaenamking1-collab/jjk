# 편집기에서만 돌던 **유지보수 함수를 에이전트가 실행**하는 통로.
#
# 왜 필요한가: _diagPortfolioLog·rebuildPortfolioLogDay 같은 진단·복구 함수는 Apps Script
# 편집기에서 ▶ 를 눌러야만 돌았다. 그래서 매번 소유자에게 "이 함수 실행하고 로그 붙여넣어
# 주세요"를 부탁했고, 한 번 고치는 데 왕복이 서너 번씩 걸렸다(2026-09-12).
# 웹앱(/exec)은 이미 소유자 권한으로 도니, Code.gs 의 runMaint 액션을 치면 끝이다.
#
# 안전: runMaint 는 PUBLIC_ACTIONS 가 아니라 **APP_TOKEN 이 있어야** 통과하고,
#       Code.gs 의 MAINT_ALLOW 화이트리스트에 적힌 함수만 실행한다.
#
# 준비(한 번만): Apps Script 스크립트 속성의 APP_TOKEN 값을
#   저장소 Settings → Secrets and variables → Actions → New repository secret
#   이름을 APP_TOKEN 으로 저장. ⛔ 값은 저장소 파일·일지·커밋 메시지에 절대 적지 않는다.
name: maint

on:
  workflow_dispatch:
    inputs:
      fn:
        description: '실행할 함수 (MAINT_ALLOW 에 있는 것만)'
        required: true
        default: '_diagPortfolioLog'
      arg:
        description: '함수에 넘길 인자 (rebuildPortfolioLogDay 면 날짜 yyyy-MM-dd)'
        required: false
        default: ''

jobs:
  maint:
    runs-on: ubuntu-latest
    steps:
      - name: runMaint 호출
        env:
          FN: ${{ github.event.inputs.fn }}
          ARG: ${{ github.event.inputs.arg }}
          TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::APP_TOKEN Secret 이 없습니다. 이 파일 맨 위 주석의 '준비' 항목을 보세요."
            exit 1
          fi
          BASE='https://script.google.com/macros/s/AKfycbwJS1Fd-sDCVKPLJEpEWZmPQEKAOR9pG7y-nPKZOYty65j3ArOmlDzNX2WFqiGNF_s/exec'
          echo "=== runMaint fn=$FN arg=${ARG:-(없음)} ==="
          # ⚠️ /exec 는 script.googleusercontent.com 으로 302된 뒤 응답을 돌려주는데 이 배달 구간이
          # 간헐적으로 깨진다 — 오래 끌다 404 로 죽고, 서버 실행 기록에는 '완료됨'으로 남는다
          # (WORKLOG 153). 앱의 api() 는 이미 재시도하는데 이 통로는 안 해서 진단이 반반 확률로
          # 헛돌았다(2026-09-14). 200 이 올 때까지 최대 3번 친다.
          # ⚠️ 재시도는 **MAINT_ALLOW 함수가 전부 여러 번 돌려도 같은 결과**라서 안전하다
          #   (_diag* 는 읽기 전용, rebuildPortfolioLogDay 는 그날 행을 지우고 다시 쓰고,
          #    resetAllTriggers 는 지우고 다시 만든다). 그렇지 않은 함수를 넣는다면 여기를 손봐라.
          # ⚠️ 토큰이 로그에 찍히지 않도록 -G --data-urlencode 로 붙인다(URL 을 echo 하지 않는다).
          code=000
          for try in 1 2 3; do
            code=$(curl -sL -o /tmp/r.json -w '%{http_code}' --max-time 340 -G \
                     --data-urlencode "action=runMaint" \
                     --data-urlencode "fn=$FN" \
                     --data-urlencode "arg=$ARG" \
                     --data-urlencode "token=$TOKEN" \
                     "$BASE") || true
            echo "시도 $try → HTTP $code · $(wc -c < /tmp/r.json) bytes"
            # ⚠️ `[ .. ] && ..` 로 쓰면 조건이 거짓일 때 목록이 비정상 종료로 잡혀 set -e 가
            # 스크립트를 죽인다. if 로 쓴다.
            if [ "$code" = "200" ]; then break; fi
            if [ "$try" != "3" ]; then sleep $((try * 5)); fi
          done
          # log 배열을 한 줄씩 풀어 찍는다. JSON 이 아니면(HTML 오류 페이지 등) 그대로 보여준다.
          python3 - <<'PY'
          import json, sys
          raw = open('/tmp/r.json', encoding='utf-8', errors='replace').read()
          try:
              d = json.loads(raw)
          except Exception:
              print('--- JSON 이 아님 (앞 4000자) ---')
              print(raw[:4000]); sys.exit(1)
          if d.get('error') == 'unauthorized':
              print('::error::토큰 거부됨. APP_TOKEN Secret 값이 스크립트 속성과 같은지 확인하세요.')
              print(json.dumps(d, ensure_ascii=False)); sys.exit(1)
          print('실행:', d.get('ran'), '· 성공:', d.get('success'), '·', d.get('ms'), 'ms')
          for line in d.get('log') or []:
              print(' |', line)
          if d.get('error'):
              print('--- 오류 ---'); print(d['error'])
          if d.get('result') is not None:
              print('--- 반환값 ---')
              print(json.dumps(d['result'], ensure_ascii=False, indent=2)[:8000])
          sys.exit(0 if d.get('success') else 1)
          PY
