# 별도 Apps Script 프로젝트 '백엔드감시'(watchdog/)를 만들고 코드를 올린다.
# 처음 실행: 프로젝트를 새로 만들고 ID 를 watchdog/script_id.txt 로 커밋한다(ID 는 비밀이 아니다).
# 그다음부터: 같은 프로젝트에 watchdog.gs·manifest.json 을 덮어쓴다.
# 트리거 설치(setup)는 캘린더 권한 동의가 필요해 소유자가 편집기에서 ▶ 한 번 눌러야 한다.
# 토큰: deploy.yml 과 같은 CLASPRC_JSON. ⛔ 값은 출력하지 않는다.
name: watchdog-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['watchdog/**']

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 올리기
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$CLASPRC" > /tmp/rc.json
          CID=$(jq -r '.oauth2ClientSettings.clientId // .tokens.default.client_id' /tmp/rc.json)
          CSEC=$(jq -r '.oauth2ClientSettings.clientSecret // .tokens.default.client_secret' /tmp/rc.json)
          RT=$(jq -r '.token.refresh_token // .tokens.default.refresh_token' /tmp/rc.json)
          rm -f /tmp/rc.json
          AT=$(curl -s https://oauth2.googleapis.com/token -d client_id="$CID" -d client_secret="$CSEC" \
                 -d refresh_token="$RT" -d grant_type=refresh_token | jq -r .access_token)
          echo "::add-mask::$AT"
          [ -n "$AT" ] && [ "$AT" != null ] || { echo "::error::액세스 토큰 발급 실패"; exit 1; }
          if [ ! -s watchdog/script_id.txt ]; then
            R=$(curl -s -H "Authorization: Bearer $AT" -H 'Content-Type: application/json' \
                  -d '{"title":"백엔드감시"}' https://script.googleapis.com/v1/projects)
            SID=$(echo "$R" | jq -r '.scriptId // empty')
            [ -n "$SID" ] || { echo "$R" | jq .error; exit 1; }
            echo "$SID" > watchdog/script_id.txt; echo "새 프로젝트 $SID"
          fi
          SID=$(cat watchdog/script_id.txt)
          jq -n --rawfile m watchdog/manifest.json --rawfile g watchdog/watchdog.gs \
            '{files:[{name:"appsscript",type:"JSON",source:$m},{name:"watchdog",type:"SERVER_JS",source:$g}]}' > /tmp/body.json
          R=$(curl -s -X PUT -H "Authorization: Bearer $AT" -H 'Content-Type: application/json' \
                --data-binary @/tmp/body.json "https://script.googleapis.com/v1/projects/$SID/content")
          echo "$R" | jq -e '.files' >/dev/null || { echo "$R" | jq .error; exit 1; }
          echo "올림: $(echo "$R" | jq -r '[.files[].name] | join(", ")')"
          echo "편집기: https://script.google.com/d/$SID/edit"
      - name: 새 ID 커밋
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add watchdog/script_id.txt
          git commit -qm "백엔드감시 프로젝트 ID" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
