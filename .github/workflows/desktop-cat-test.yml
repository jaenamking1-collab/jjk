# 바탕화면 고양이(desktop-cat/)를 실제 윈도우에서 돌려 보고 스크린샷·로그를 desktop-cat-test-out 브랜치에 올린다.
# 원격 컨테이너는 리눅스라 윈도우 창·아이콘·투명 창을 직접 시험할 수 없어서 만든 통로다.
name: desktop-cat-test

on:
  push:
    paths: ['desktop-cat/**', '.github/workflows/desktop-cat-test.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow numpy
      - run: python desktop-cat/wintest.py out
      - name: desktop-cat-test-out 브랜치로
        if: always()
        shell: bash
        run: |
          cd out
          git init -q -b desktop-cat-test-out
          git config user.name 'github-actions[bot]'; git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A; git commit -qm "desktop-cat test $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" desktop-cat-test-out
