# 휴대폰 시세 중계(ticker_relay.gs)에 포트폴리오 API 열쇠를 한 번 넣는다.
# 왜: 휴대폰 화면의 '총자산' 줄이 대시보드 수익로그를 읽으려면 열쇠가 필요한데, 열쇠는 저장소에
#     적을 수 없다(공개). Secret 으로만 넘기고, 로그에는 GitHub 이 가린 값(***)만 남는다.
# 중계는 이미 열쇠가 있으면 바꾸지 않는다. 결과는 stored/had 두 값만 찍는다.
name: relay-token

on:
  workflow_dispatch:

jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - name: 열쇠 넣기
        env:
          TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          curl -sL -G --max-time 60 --data-urlencode "settoken=$TOKEN" \
            'https://script.google.com/macros/s/AKfycbwjjzNI_BpGyvJ_-3j2b-6VxQB2m5HXmQhiOkvGBrmPYx7hvs9xIL4KjoblZzjEiOph/exec' \
            | grep -o '"stored":[a-z]*,"had":[a-z]*'
