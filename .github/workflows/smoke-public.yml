# 공개 분배금공지(https://jjk.distributionjn.workers.dev/)를 **실제 크롬으로 열어** 방문자가 보는 화면을 검사한다.
# 왜: 2026-10-01 HANARO·KIWOOM 추가 직후 사용자 화면에 9월 말 회차가 통째로 '예정(?)'으로만 나왔다.
#     백엔드 응답만 보고 '정상'이라 했던 게 문제 — 사람이 보는 결과를 직접 센다(CLAUDE.md 0-1).
# 판정: JS 오류 0 · 헤더 'N곳 최신'의 N = 운용사 수 · 운용사 카드마다 날짜 붙은(확정) 줄이 1개 이상 · 달력 확정 칩 존재.
# 실패하면 카톡(runMaint sendKakaoMemo) + 실행 실패 메일. 스크린샷은 probe-out 브랜치 smoke/ 에 남긴다.
name: smoke-public

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths: ['dist_notice.html']

permissions:
  contents: write
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: 배포 반영 대기 (push 때만)
        if: ${{ github.event_name == 'push' }}
        run: sleep 150
      - name: 크롬 준비
        run: |
          npm i playwright@1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: 공개 페이지 검사
        id: chk
        run: |
          cat > s.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ viewport: { width: 1900, height: 1000 } });
            const errs = [];
            p.on('pageerror', e => errs.push(e.message));
            await p.goto('https://jjk.distributionjn.workers.dev/?smoke=' + Date.now(), { waitUntil: 'load', timeout: 60000 });
            // 데이터가 다 올 때까지(최대 90초) '곳 최신' 문구를 기다린다
            try { await p.waitForFunction(() => /\d+곳 최신/.test(document.body.innerText), null, { timeout: 90000 }); } catch (e) {}
            await p.waitForTimeout(3000);
            const r = await p.evaluate(() => {
              const t = document.body.innerText;
              const m = t.match(/(\d+)곳 최신/);
              // 공지 표: 운용사 한 칸(rowspan) 아래 줄들까지 묶어서, 운용사마다 날짜(MM.DD)가 하나 이상 있어야 한다.
              // (첫 줄만 세면 월중이 없는 HANARO 를 '비었다'고 오탐한다 — 2026-10-01)
              const cards = [];
              document.querySelectorAll('.nt-table tbody tr').forEach(r => {
                const b = r.querySelector('.nt-brand');
                if (b) cards.push({ name: b.querySelector('b') ? b.querySelector('b').innerText.trim() : b.innerText.split('\n')[0].trim(), dated: 0 });
                if (cards.length) cards[cards.length - 1].dated += (r.innerText.match(/\d\d\.\d\d/g) || []).length;
              });
              // 운용사별 일정 표에서 '(예정)'이 아닌(=공시가 실제로 나온) 회차가 있는 운용사만 공지가 있어야 한다.
              // 달 초엔 8곳 모두 공시 전이라 공지 표가 비는 게 정상이다(2026-10-04 10월 넘어간 뒤 매시간 오탐 메일).
              const announced = new Set(); let cur = '';
              document.querySelectorAll('#distScheduleList tbody tr').forEach(r => {
                const s = r.querySelector('td[rowspan] span, td:first-child > span');
                if (s && r.cells.length >= 6) cur = s.innerText.trim();
                if (cur && /월(중|말)/.test(r.innerText) && !r.innerText.includes('(예정)')) announced.add(cur);
              });
              cards.forEach(c => c.announced = announced.has(c.name));
              const chips = [...document.querySelectorAll('.cal-chip')].filter(x => x.innerText.trim() && !x.innerText.includes('?')).length;
              // 운용사 사이트를 못 읽어 대체 자료(예탁결제원·뉴스·블로그)로 채운 곳 — 헤더 '⚠️ TIGER·RISE 대체 자료'
              const vm = t.match(/⚠️\s*([A-Z·]+)\s*대체 자료/);
              const via = vm ? vm[1].split('·').filter(Boolean) : [];
              return { fresh: m ? +m[1] : 0, via, cards, chips, total: (typeof DIST_SOURCES !== 'undefined') ? DIST_SOURCES.length : 0 };
            });
            await p.screenshot({ path: 'shot.png' });
            // 운용사별 일정 표 칸 검사(2026-10-14: ACE 10월 월중 분배락·기준 '·', KIWOOM 9월 월중 '공시 전'을 사용자가 먼저 봤다).
            //  · 이번 달: 공시가 난 줄('(예정)' 아님)은 공시·분배락·기준·지급 네 칸이 모두 날짜여야 한다.
            //  · 지난달: 모든 줄이 공시 난 줄이어야 한다('공시 전'·'(예정)'이 남으면 그 달 자료가 빠진 것).
            const rowsOf = () => p.evaluate(() => { let cur = ''; return [...document.querySelectorAll('#distScheduleList tbody tr')].map(r => {
              const s = r.querySelector('td[rowspan] span'); if (s) cur = s.innerText.trim();
              const c = [...r.cells].map(x => x.innerText.trim()); return { who: cur, label: c[c.length - 5], dates: c.slice(-4) }; }); });
            const cellBad = [];
            const full = r => r.dates.every(d => /^\d{1,2}\/\d{1,2}$/.test(d));
            // 대체 자료(예탁결제원)엔 공시일이 없다 — 그 운용사는 공시 칸만 비어도 정상으로 본다(대체 자료 자체는 아래에서 따로 알린다).
            const fullV = x => r.via.includes(x.who) ? x.dates.slice(1).every(d => /^\d{1,2}\/\d{1,2}$/.test(d)) : full(x);
            (await rowsOf()).filter(x => !/예정/.test(x.label) && !fullV(x)).forEach(x => cellBad.push(`${x.who} ${x.label} 빈 칸(${x.dates.join(' ')})`));
            try {
              await p.evaluate(() => schedShiftMonth(-1)); await p.waitForTimeout(1500);
              (await rowsOf()).filter(x => /예정/.test(x.label) || !full(x)).forEach(x => cellBad.push(`지난달 ${x.who} ${x.label} 빠짐(${x.dates.join(' ')})`));
              await p.evaluate(() => schedShiftMonth(1));
            } catch (e) { cellBad.push('지난달 표 열기 실패 ' + e.message); }
            r.cellBad = cellBad;
            const bad = [];
            cellBad.slice(0, 4).forEach(x => bad.push(x));
            if (errs.length) bad.push('JS 오류: ' + errs.slice(0, 2).join(' / '));
            if (r.fresh + r.via.length !== r.total) bad.push(`최신 ${r.fresh}/${r.total}곳`);
            // 대체 자료로 버티는 상태도 한 번은 알린다(같은 문구면 카톡은 다시 안 간다 — 아래 중복 비교).
            if (r.via.length) bad.push(`${r.via.join('·')} 운용사 사이트 응답 없음(대체 자료로 표시 중)`);
            r.cards.filter(c => !c.dated && c.announced).forEach(c => bad.push(c.name + ' 공지 비어 있음'));
            if (!r.chips) bad.push('달력 확정 칩 0개');
            if (r.cards.length !== r.total) bad.push(`공지 표 ${r.cards.length}/${r.total}행`);
            console.log(JSON.stringify(r));
            console.log(bad.length ? 'FAIL ' + bad.join(' · ') : 'OK');
            require('fs').writeFileSync('result.txt', bad.length ? bad.join(' · ') : '');
            await b.close();
          })();
          EOF
          node s.js
          # 한 번 실패로 바로 카톡을 보내지 않는다 — 2분 뒤 다시 보고 그래도 이상할 때만 알린다.
          # (2026-10-01 저녁 잠깐의 응답 지연·작업 중 상태로 카톡이 9번 갔다)
          if [ -s result.txt ]; then echo "1차 이상: $(cat result.txt) — 2분 뒤 재확인"; sleep 120; node s.js; fi
          echo "bad=$(cat result.txt)" >> "$GITHUB_OUTPUT"
      - name: 스크린샷 보관
        if: always()
        run: |
          mkdir -p o/smoke && cp shot.png o/smoke/ 2>/dev/null; cp result.txt o/smoke/ 2>/dev/null; date -u +%FT%TZ > o/smoke/at.txt
          cd o && git init -q -b probe-out && git config user.name 'github-actions[bot]' && git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A && git commit -qm smoke && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
      # 같은 문제로 매시간 카톡·메일이 가지 않게, 열린 이슈를 '이미 알렸다'는 표시로 쓴다(2026-10-06 RISE 한 곳 멈춤에 매시간 알림).
      # 새 문제(이슈 없음·내용이 바뀜)일 때만 카톡 + 실패로 끝낸다. 정상으로 돌아오면 이슈를 닫는다(복구 알림은 보내지 않는다).
      - name: 정상이면 이슈 닫기
        if: ${{ steps.chk.outputs.bad == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh issue list -R "${{ github.repository }}" --state open --search "공개 분배금공지 화면 이상 in:title" --json number --jq '.[0].number // empty')
          [ -n "$N" ] && gh issue close "$N" -R "${{ github.repository }}" --comment "✅ 정상으로 돌아왔습니다 ($(TZ=Asia/Seoul date '+%m/%d %H:%M') KST)." || true
      - name: 실패 알림
        if: ${{ steps.chk.outputs.bad != '' }}
        env:
          TOKEN: ${{ secrets.APP_TOKEN }}
          BAD: ${{ steps.chk.outputs.bad }}
          GH_TOKEN: ${{ github.token }}
        run: |
          R="${{ github.repository }}"
          N=$(gh issue list -R "$R" --state open --search "공개 분배금공지 화면 이상 in:title" --json number,body --jq '.[0].number // empty')
          # 숫자는 빼고 비교한다 — '최신 0/8곳'→'최신 1/8곳'처럼 개수만 바뀐 건 같은 문제다
          KEY=$(echo "$BAD" | sed 's/[0-9]//g')
          if [ -n "$N" ] && [ "$(gh issue view "$N" -R "$R" --json body --jq .body | sed 's/[0-9]//g')" = "$KEY" ]; then
            echo "::warning::이미 알린 문제(이슈 #$N) — 카톡·실패 메일 생략: $BAD"; exit 0
          fi
          if [ -n "$N" ]; then gh issue edit "$N" -R "$R" --body "$BAD"
          else gh issue create -R "$R" --title "🚨 공개 분배금공지 화면 이상" --body "$BAD"; fi
          curl -sL -o /dev/null -G --max-time 120 --data-urlencode action=runMaint --data-urlencode fn=sendKakaoMemo \
            --data-urlencode "arg=🚨 공개 분배금공지 화면 이상: $BAD — https://jjk.distributionjn.workers.dev/" --data-urlencode "token=$TOKEN" \
            'https://script.google.com/macros/s/AKfycbwJS1Fd-sDCVKPLJEpEWZmPQEKAOR9pG7y-nPKZOYty65j3ArOmlDzNX2WFqiGNF_s/exec' || true
          echo "::error::$BAD"; exit 1
