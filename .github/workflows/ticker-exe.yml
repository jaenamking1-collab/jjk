# 바탕화면 시세 위젯을 파이썬 설치 없이 도는 '실시간시세.exe' 로 묶어 릴리스(태그 ticker)에 올린다.
# 받는 곳: https://github.com/jaenamking1-collab/jjk/releases/tag/ticker
# exe 는 껍데기(tools/ticker_launcher.py)라 켤 때마다 최신 ticker.pyw 를 받아 돈다 —
# 위젯 코드를 고쳐도 exe 를 다시 만들 필요는 없다. 껍데기·이 파일을 고칠 때만 다시 빌드된다.
name: ticker-exe

on:
  push:
    branches: [main]
    paths: ['tools/ticker_launcher.py', '.github/workflows/ticker-exe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow pyinstaller
      - name: 아이콘 만들기
        working-directory: tools
        run: |
          python -c "from PIL import Image, ImageDraw; s=256; im=Image.new('RGBA',(s,s),(0,0,0,0)); d=ImageDraw.Draw(im); d.rounded_rectangle((8,8,s-8,s-8),radius=48,fill='#2a2f3a'); d.line([(44,180),(100,120),(140,150),(212,70)],fill='#ff5c66',width=22,joint='curve'); d.polygon([(212,52),(222,96),(178,78)],fill='#ff5c66'); im.save('ticker.ico',sizes=[(16,16),(32,32),(48,48),(256,256)])"
      - name: exe 만들기
        working-directory: tools
        run: pyinstaller --noconfirm --onefile --noconsole --name RealtimeTicker --icon ticker.ico ticker_launcher.py
      - name: exe 실행 시험 (30초)
        shell: pwsh
        run: |
          $d = Join-Path $env:LOCALAPPDATA 'ticker'
          $p = Start-Process -FilePath tools\dist\RealtimeTicker.exe -PassThru
          Start-Sleep -Seconds 30
          $alive = -not $p.HasExited
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$pwd\shot.png")
          if ($alive) { Stop-Process -Id $p.Id -Force }
          Get-ChildItem $d
          if (Test-Path "$d\error.log") { Get-Content "$d\error.log"; throw '오류 기록이 있다' }
          if (-not $alive) { throw 'exe 가 30초 안에 꺼졌다' }
          if (-not (Test-Path "$d\ticker.pyw")) { throw '위젯 코드를 못 받았다' }
          (Get-Item tools\dist\RealtimeTicker.exe).Length / 1MB
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shot
          path: shot.png
      - name: 릴리스(ticker)에 올리기
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp tools/dist/RealtimeTicker.exe "tools/dist/실시간시세.exe"
          gh release view ticker >/dev/null 2>&1 || gh release create ticker --title "실시간 시세 위젯" \
            --notes "실시간시세.exe 를 받아 더블클릭하면 됩니다(파이썬 설치 필요 없음). 처음 실행 때 'Windows의 PC 보호' 창이 뜨면 '추가 정보 → 실행'."
          gh release upload ticker "tools/dist/실시간시세.exe" --clobber
