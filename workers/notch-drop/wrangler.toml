# 노치 파일 전송 중계(와이파이가 달라도 휴대폰 ↔ PC). 배포: 이 폴더에서 wrangler deploy
# 주소: https://notch-drop.distributionjn.workers.dev/<방 열쇠>
# 방 하나 = Durable Object 하나. 파일은 1시간 쉬면 방째 지워진다.
name = "notch-drop"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
