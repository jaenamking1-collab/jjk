<script>
const data=JSON.parse(document.getElementById('data').textContent),map=L.map('map').setView([37.739,127.057],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const schoolLayer=L.layerGroup().addTo(map),railLayer=L.layerGroup().addTo(map),colors={'초등학교':'#1684d5','중학교':'#e37d20','고등학교':'#32965a'},lineColors={'1호선':'#164b9b','7호선':'#777b22','의정부경전철':'#ed8b19'};
const type=document.getElementById('type'),search=document.getElementById('search'),names=document.getElementById('names'),rail=document.getElementById('rail');
function render(){schoolLayer.clearLayers();railLayer.clearLayers();const query=search.value.trim();let n=0;for(const s of data.schools){if(type.value&&s.type!==type.value||query&&!s.name.includes(query))continue;n++;const marker=L.circleMarker([s.lat,s.lon],{radius:6,color:'#fff',weight:1.5,fillColor:colors[s.type],fillOpacity:1}).addTo(schoolLayer);marker.bindTooltip(s.name,{permanent:names.checked,direction:'right',className:'school-name'});marker.on('click',()=>document.getElementById('detail').textContent=s.name+' · '+s.type+' · '+s.address);}
if(rail.checked){for(const line of Object.keys(lineColors)){const stations=data.stations.filter(s=>s.line===line).sort((a,b)=>a.order-b.order);if(stations.length>1)L.polyline(stations.map(s=>[s.lat,s.lon]),{color:lineColors[line],weight:4,opacity:.8,dashArray:'8 4'}).addTo(railLayer);for(const s of stations){const marker=L.circleMarker([s.lat,s.lon],{radius:7,color:lineColors[line],weight:3,fillColor:'#fff',fillOpacity:1}).addTo(railLayer);marker.bindTooltip(s.name+'역',{permanent:!query||s.name.includes(query),direction:'left',className:'station-name'});marker.on('click',()=>document.getElementById('detail').textContent=s.line+' · '+s.name+'역'+(s.name==='회룡'?' · 1호선 ↔ 경전철 환승':''));}}}document.getElementById('count').textContent='학교 '+n+'곳 · 철도 '+(rail.checked?'22개 역 표시':'숨김');}
for(const el of [type,search,names,rail])el.addEventListener('input',render);document.getElementById('reset').onclick=()=>{type.value='';search.value='';map.fitBounds(data.schools.map(s=>[s.lat,s.lon]),{padding:[65,65]});render();};render();map.fitBounds(data.schools.map(s=>[s.lat,s.lon]),{padding:[65,65]});
