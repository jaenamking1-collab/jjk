<header class="top">
  <img class="logo" src="icons/48.png" alt="">
  <h1>줍줍</h1>
  <span class="total" id="total"></span>
  <button class="shelf-btn" id="shelfBtn" aria-haspopup="true" aria-expanded="false"></button>
  <button class="gear" id="settingsBtn" aria-label="설정" title="설정">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
  </button>
  <div class="layouts" role="group" aria-label="칸 나누기">
    <button data-layout="1" aria-label="1칸"><i class="g1"><b></b></i></button>
    <button data-layout="2" aria-label="2칸"><i class="g2"><b></b><b></b></i></button>
    <button data-layout="4" aria-label="4칸"><i class="g4"><b></b><b></b><b></b><b></b></i></button>
  </div>
</header>

<div class="shelf" id="shelf" hidden>
  <strong>링크 판 목록</strong>
  <div class="shelf-list" id="shelfList"></div>
  <button class="shelf-add" id="shelfAdd">새 판 만들기</button>
</div>

<div class="shelf" id="settings" hidden>
  <strong>저장 위치</strong>
  <p class="store-place" id="storePlace"></p>
  <p class="store-note" id="storeNote"></p>
  <button class="shelf-add" id="storeReconnect" hidden>폴더 다시 연결</button>
  <button class="shelf-add" id="storePick"></button>
  <button class="store-sub" id="storeLocal" hidden>브라우저 안에만 저장하기</button>
</div>

<main id="spaces"></main>

<div class="dock" id="dock" hidden>
  <svg class="dock-joobi"><use href="#joobi"/></svg>
  <span id="dockText"></span>
  <button id="dockCancel">버리기</button>
</div>

<div class="toast" id="toast" hidden>
  <span id="toastText"></span>
  <button id="toastUndo">되돌리기</button>
</div>

<script src="store.js"></script>
<script src="board.js"></script>
</body>
</html>
