<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="시세">
<link rel="manifest" href="ticker.webmanifest">
<link rel="icon" href="ticker-192.png">
<link rel="apple-touch-icon" href="ticker-192.png">
<title>시세</title>
<!--
  휴대폰용 시세 화면. PC 위젯(tools/ticker.pyw)의 모양과 규칙을 그대로 옮겼다.
  시세는 Apps Script 중계(ticker_relay.gs)가 받아 준다 — 휴대폰 브라우저는 빗썸·야후·네이버에
  직접 못 묻는다(CORS). 종목 목록은 이 휴대폰 브라우저에만 저장된다(공개 저장소라 목록을 못 둔다).
-->
<style>
:root{--bg:#111418;--line:#262b33;--row:#1d2127;--fg:#e8eaed;--dim:#8a919c;--up:#ff3b47;--down:#3d9bff;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;-webkit-tap-highlight-color:transparent}
body{padding:calc(6px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom))}
#top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-bottom:2px}
#top b{color:var(--fg);font-size:15px;margin-right:auto}
#alive{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2ecc71}
#alive.stale{background:#777}
#top button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:3px 8px;font-size:12px}
#warn{display:none;background:#3a2f12;color:#f4c35a;border-radius:6px;padding:6px 8px;font-size:12px;margin-bottom:6px}
.sep{height:1px;background:var(--line);margin:3px 0}
/* 칸 폭을 고정해 줄마다 숫자 끝이 같은 세로선에 서게 한다(자동 폭이면 비트코인 줄만 어긋났다) */
.row{display:grid;grid-template-columns:minmax(0,1fr) auto 66px;align-items:center;column-gap:8px;
  padding:3px 2px;border-bottom:1px solid var(--row);line-height:1.25}   /* 9px→3px: 갤럭시에서 한눈에 안 들어왔다(10/07) */
body.detail .row{grid-template-columns:minmax(0,1fr) auto 66px 78px}
.nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.px{font-family:Consolas,"SF Mono",Menlo,monospace;font-size:16px;text-align:right}
.ch,.amt{font-family:Consolas,"SF Mono",Menlo,monospace;font-size:13px;text-align:right;
  padding:2px 4px;border-radius:4px}
.amt{display:none}
body.detail .amt{display:block}
.band{grid-column:1/-1;font-size:11px;color:var(--dim);margin-top:0;line-height:1.2}
.up{color:var(--up)} .down{color:var(--down)} .dim{color:var(--dim)}
.flash-up{animation:fu 1s steps(1) infinite} .flash-down{animation:fd 1s steps(1) infinite}
@keyframes fu{50%{background:rgba(255,59,71,.28)}} @keyframes fd{50%{background:rgba(61,155,255,.28)}}
#notice{margin-top:6px;border-top:1px solid var(--line);padding-top:4px}
.brow{display:flex;align-items:center;gap:8px;margin:3px 0}
.brow .cy{font-weight:700;font-size:15px;color:#3a404a;width:38px;flex:none}
.brow .cy.on{color:var(--fg)}
/* 포트폴리오 앱 분배금 달력의 회사 배지와 같은 모양: 이름 전체, 회사 색 바탕, 흰 굵은 글자, 각진 모서리. 4곳씩 두 줄 */
.chips{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.chip{font-weight:700;font-size:12px;color:#3a404a;border:1px solid #2a3038;border-radius:3px;
  height:20px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
/* 켜짐 = 회사 색(포트폴리오 앱 DIST_SOURCES 와 같은 색)으로 꽉 찬 아이콘, 깜박일 땐 바탕만 빠진다 */
.chip.lit{background:var(--c);color:#fff;border-color:var(--c)}
.chip.new{animation:cb .9s steps(1) infinite}
@keyframes cb{50%{background:transparent;color:var(--c)}}
#bline{font-size:15px;color:var(--dim);margin-top:3px}
#bline.on{color:var(--fg)}
#edit{display:none;margin-top:10px}
#edit textarea{width:100%;height:46vh;background:#0b0d10;color:var(--fg);border:1px solid var(--line);
  border-radius:6px;font:13px/1.5 Consolas,monospace;padding:8px}
#edit .help{font-size:11px;color:var(--dim);line-height:1.6;margin:6px 0}
#edit button{background:#2a6df4;color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:14px;margin-right:6px}
#edit button.ghost{background:none;border:1px solid var(--line);color:var(--dim)}
#hint{font-size:11px;color:var(--dim);text-align:center;margin-top:6px}
#hint:empty{display:none}   /* 평소엔 숨김 — 한 화면에 다 들어가게. 알릴 말이 있을 때만 */
</style>
</head>
<body>
<div id="top"><b>시세</b><span id="alive" class="stale"></span><span id="stamp">불러오는 중…</span>
  <button id="editBtn">편집</button></div>
<div id="warn"></div>
<div id="list"></div>
<!-- 총평가: 맨 위가 아니라 시세 목록 맨 아래(2026-10-07 사용자 지정) -->
<div id="total" class="row" style="display:none;border-top:1px solid var(--line);margin-top:3px" onclick="detail=!detail;store.set('tk_detail',detail);document.body.classList.toggle('detail',detail)"><div class="nm">총평가</div><div class="px">…</div>
  <div class="ch dim"></div><div class="amt"></div><div class="band"></div></div>
<div id="notice"></div>
<div id="hint"></div>
<div id="edit">
  <textarea id="ta" spellcheck="false"></textarea>
  <div class="help">
    한 줄에 하나. PC 위젯 환경설정과 같은 형식입니다.<br>
    <code>코드=보일이름</code> · 그룹 나누기 <code>---</code><br>
    국내지수 <code>KOSPI</code> · 국내종목 <code>069500</code> · 코인 <code>XRP-KRW</code> ·
    해외 <code>AAPL</code> <code>^IXIC</code> · 환율 <code>USDKRW=X</code><br>
    교환비율 <code>XRP-KRW/KAIA-KRW=이름 @49,50,v41</code> (v=하한)<br>
    집 PC 목록: 받은 <b>8글자 코드</b>를 칸에 적고 저장(또는 복사 후 📋). 한 번 넣으면 열 때마다 집 목록을 따라옵니다
  </div>
  <button id="pasteBtn">📋 복사한 코드 붙여넣기</button><br style="margin-bottom:6px">
  <button id="saveBtn">저장</button><button class="ghost" id="cancelBtn">취소</button>
  <button class="ghost" id="resetBtn">기본값</button>
</div>
<script>
// Apps Script 중계(ticker_relay.gs, 'XRP-카이아 비율 알림' 프로젝트의 웹앱 배포).
const RELAY = 'https://script.google.com/macros/s/AKfycbwjjzNI_BpGyvJ_-3j2b-6VxQB2m5HXmQhiOkvGBrmPYx7hvs9xIL4KjoblZzjEiOph/exec';
const REFRESH = 10000;        // ms. 중계가 15초 캐시하므로 이보다 자주 물어도 같은 값이다
const STALE = 60000;          // 이만큼 못 받으면 회색 경고 — 멈춘 줄 모르고 보는 일이 없게
const ALERT = 5.0;            // 등락률 이 이상이면 반짝임(위젯과 같다)
const RATIO = '/';
const DEFAULT = ['KOSPI=코스피','069500=코덱스200','USDKRW=X=환율','---',
  'BTC-KRW=비트코인','XRP-KRW=XRP','KAIA-KRW=카이아','XRP-KRW/KAIA-KRW=XRP당 카이아 @49,50,v41','---',
  '^IXIC=나스닥','^GSPC=S&P500'];

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let tickers = store.get('tk_list', DEFAULT);
let detail  = store.get('tk_detail', false);
let last = {}, band = {}, okAt = 0, timer = null, imported = 0;

// 집 PC 목록 가져오기: ticker.html#import=<base64url(JSON 배열)>.
// 목록엔 보유 종목이 들어 있어 공개 저장소인 이 파일엔 못 적는다. 주소의 # 뒤는 서버로 가지 않고,
// 이 브라우저에 저장한 뒤 주소에서 지운다(새로고침해도 다시 덮어쓰지 않게).
// ⚠️ 링크를 Claude 앱 안의 브라우저·삼성 인터넷으로 열면 목록이 **그 브라우저에만** 저장되고,
// 크롬으로 만든 홈 화면 아이콘은 못 본다(2026-10-07 "바로가기에 설정값이 안 날아온다").
// 그래서 같은 링크를 아이콘 안의 '편집 → 붙여넣기'로도 넣을 수 있게 했다(decodeImport 공용).
function decodeImport(text){
  const m = String(text || '').match(/import=([A-Za-z0-9_-]+)/);
  if (!m) return null;
  try{
    const bin = atob(m[1].replace(/-/g, '+').replace(/_/g, '/'));
    const arr = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
    return (Array.isArray(arr) && arr.length && arr.every(x => typeof x === 'string')) ? arr : null;
  }catch(e){ return null; }
}
function applyList(arr){
  tickers = arr; store.set('tk_list', arr);
  return arr.filter(x => !x.startsWith('---')).length;
}
// 짧은 코드(8글자) 방식: 목록은 중계(Private.gs, 저장소에 없음)에 두고 코드로 받는다.
// 긴 #import= 링크는 Claude 앱이 '…'로 줄여 복사돼 깨졌다(2026-10-07, CLAUDE.md 0-3).
// 코드를 한 번 넣으면 기억해 두고 **열 때마다 목록을 다시 받는다** — 집 목록을 바꾸면 폰도 따라온다.
function codeOf(text){
  const m = String(text || '').trim().match(/(?:^|k=)([a-z2-9]{8})(?![a-z2-9])/);
  return m ? m[1] : null;
}
async function fetchList(code){
  try{
    const j = await (await fetch(RELAY + '?list=' + encodeURIComponent(code), {cache:'no-store'})).json();
    return (Array.isArray(j.list) && j.list.length) ? j.list : null;
  }catch(e){ return null; }
}
async function useCode(code, quiet){
  const arr = await fetchList(code);
  if (!arr){ if (!quiet) alert('코드를 찾지 못했어요: ' + code); return 0; }
  store.set('tk_code', code);
  loadTotal();
  const changed = JSON.stringify(arr) !== JSON.stringify(tickers);
  const n = applyList(arr);
  if (changed){ build(); load(); }
  return n;
}
(function(){
  const code = codeOf(location.hash);
  if (code){
    history.replaceState(null, '', location.pathname);
    useCode(code).then(n => { if (n) document.getElementById('hint').textContent = `집 PC 목록 ${n}종목으로 맞췄습니다`; });
    return;
  }
  if (/^#import=/.test(location.hash)){
    const arr = decodeImport(location.hash);
    if (arr) imported = applyList(arr);
    history.replaceState(null, '', location.pathname);
    return;
  }
  const saved = store.get('tk_code', null);
  if (saved) useCode(saved, true);          // 열 때마다 집 목록을 따라간다(실패하면 지금 목록 유지)
})();

// 위젯 cut() 과 같은 브랜드 약칭. 이름을 직접 안 준 종목(코드만 적은 줄)에만 쓴다.
const BRAND = {KODEX:'K',TIGER:'T',RISE:'R',KBSTAR:'R',PLUS:'P',ARIRANG:'P',SOL:'S',ACE:'A',KINDEX:'A',
  HANARO:'H',KOSEF:'KF',TIMEFOLIO:'TF',WOORI:'W',FOCUS:'F',UNICORN:'U',TREX:'TX',BNK:'B',
  '히어로즈':'HR','마이티':'MT','마이다스':'MD','파워':'PW','에셋플러스':'EP'};
function cut(name){
  for (const [full, short] of Object.entries(BRAND))
    if (name.startsWith(full + ' ')) return short + ' ' + name.slice(full.length + 1);
  return name;
}

// ── 위젯 split()/target_of() 와 같은 규칙 ──
function split(line){
  const s = line.split('@')[0].trimEnd();
  const i = s.lastIndexOf('=');
  if (i > 0 && s.length - i - 1 > 1) return [s.slice(0, i), s.slice(i + 1)];
  return [s, null];
}
function targetOf(line){
  const i = line.lastIndexOf('@');
  if (i < 0) return null;
  const t = line.slice(i + 1), pct = t.trim().endsWith('%');
  const goals = [], floors = [];
  t.split(',').forEach(x => {
    x = x.trim().replace(/%$/, '');
    const low = /^[vV]/.test(x), n = parseFloat(low ? x.slice(1) : x);
    if (!isNaN(n)) (low ? floors : goals).push(n);
  });
  goals.sort((a,b)=>a-b); floors.sort((a,b)=>a-b);
  return (goals.length || floors.length) ? {goals, floors, pct} : null;
}
function groups(){
  const gs = [[]];
  tickers.forEach(l => l.trim().startsWith('---') ? gs.push([]) : l.trim() && gs[gs.length-1].push(l.trim()));
  return gs.filter(g => g.length);
}
const fmt = (v, d) => Number(v).toLocaleString('ko-KR', {minimumFractionDigits:d, maximumFractionDigits:d});

// ── 화면 ──
function build(){
  document.body.classList.toggle('detail', !!detail);
  const L = document.getElementById('list'); L.innerHTML = '';
  groups().forEach((g, gi) => {
    if (gi) L.insertAdjacentHTML('beforeend', '<div class="sep"></div>');
    g.forEach(line => {
      const [sym, name] = split(line);
      const r = document.createElement('div'); r.className = 'row'; r.dataset.sym = sym; r.dataset.line = line;
      r.innerHTML = `<div class="nm">${esc(name || sym)}</div><div class="px">…</div>` +
                    `<div class="ch dim"></div><div class="amt"></div>` +
                    (sym.includes(RATIO) ? '<div class="band"></div>' : '');
      r.onclick = () => { detail = !detail; store.set('tk_detail', detail); document.body.classList.toggle('detail', detail); };
      L.appendChild(r);
    });
  });
  paintAll();
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function quote(sym){
  if (!sym.includes(RATIO)) return last[sym] || null;
  const [a, b] = sym.split(RATIO), qa = last[a], qb = last[b];
  if (!qa || !qb || !qb[0]) return null;
  const now = qa[0] / qb[0], was = (qb[0]-qb[1]) ? (qa[0]-qa[1]) / (qb[0]-qb[1]) : 0, gap = now - was;
  return [now, gap, was ? gap / was * 100 : 0, now < 100 ? 2 : 0, null];
}

function paintAll(){
  document.querySelectorAll('#list .row').forEach(r => paint(r));
}
function paint(r){
  const sym = r.dataset.sym, q = quote(sym);
  const [nm, px, ch, amt] = r.children;
  const bd = r.querySelector('.band');
  if (!q){ ch.textContent = okAt ? '없음' : ''; ch.className = 'ch dim'; return; }
  const [price, diff, pct, dec, sname] = q;
  if (sname && nm.textContent === sym) nm.textContent = cut(sname);
  px.textContent = fmt(price, dec);
  amt.textContent = (diff > 0 ? '+' : '') + fmt(diff, dec);
  amt.className = 'amt ' + (diff > 0 ? 'up' : diff < 0 ? 'down' : 'dim');
  ch.className = 'ch'; let flash = '';

  // 교환비율 줄: 밑에 기준 구간을 늘 적는다. 오른쪽 칸엔 % 대신 말/목표를 쓴다(위젯 9/28 결정).
  let pos = null;
  if (bd){
    const b = band[sym];
    if (b && b[1] > b[0]){
      pos = Math.max(0, Math.min(100, (price - b[0]) / (b[1] - b[0]) * 100));
      bd.textContent = `최근 30일 ${b[0].toFixed(1)}~${b[1].toFixed(1)} 중 ${Math.round(pos)}%`;
    } else bd.textContent = '';
  }
  const t = targetOf(r.dataset.line);
  if (t){
    let goals = t.goals, floors = t.floors;
    if (t.pct){ const b = band[sym]; const cv = g => b ? b[0] + (b[1]-b[0]) * g / 100 : null;
      goals = goals.map(cv).filter(x=>x!=null); floors = floors.map(cv).filter(x=>x!=null); }
    const under = floors.filter(f => price <= f);
    const ahead = goals.filter(g => g > price);
    if (under.length){ ch.textContent = '▼' + under[under.length-1]; ch.classList.add('down'); flash = 'down'; }
    else if (goals.length && ahead.length){ ch.textContent = '↗' + ((ahead[0]/price-1)*100).toFixed(1) + '%'; ch.classList.add('dim'); }
    else if (goals.length){ ch.textContent = '★' + goals[goals.length-1]; ch.classList.add('up'); flash = 'up'; }
    else { ch.textContent = '△' + ((price/floors[floors.length-1]-1)*100).toFixed(1) + '%'; ch.classList.add('dim'); }
  } else if (pos != null){
    const [w, c] = pos >= 66 ? ['고점권','up'] : pos < 33 ? ['바닥권','down'] : ['중간','dim'];
    ch.textContent = w; ch.classList.add(c);
  } else {
    ch.textContent = (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
    ch.classList.add(diff > 0 ? 'up' : diff < 0 ? 'down' : 'dim');
    if (Math.abs(pct) >= ALERT) flash = diff > 0 ? 'up' : 'down';
  }
  if (flash) ch.classList.add('flash-' + flash);
}

// ── 시세 받기 ──
function wanted(){
  const s = new Set(), bands = [];
  tickers.forEach(l => { l = l.trim(); if (!l || l.startsWith('---')) return;
    const sym = split(l)[0];
    if (sym.includes(RATIO)){ sym.split(RATIO).forEach(x => s.add(x)); bands.push(sym); } else s.add(sym); });
  return [[...s], bands];
}
async function load(){
  clearTimeout(timer);
  const [syms, bands] = wanted();
  try{
    const u = RELAY + '?s=' + encodeURIComponent(syms.join(',')) + (bands.length ? '&band=' + encodeURIComponent(bands.join(',')) : '');
    const res = await fetch(u, {cache:'no-store'});
    const j = await res.json();
    Object.assign(last, j.q || {}); Object.assign(band, j.band || {});
    okAt = Date.now();
    const errs = Object.entries(j.err || {});
    const w = document.getElementById('warn');
    w.style.display = errs.length ? 'block' : 'none';
    w.textContent = errs.map(([k, v]) => `${k}: ${v}`).join(' · ');
    paintAll();
  }catch(e){ /* 네트워크 실패 — 아래 생존 표시가 회색으로 바뀌어 알려 준다 */ }
  stamp();
  if (document.visibilityState === 'visible') timer = setTimeout(load, REFRESH);
}
// 생존 표시: 마지막으로 받은 시각. 1분 넘게 못 받으면 회색 + 몇 분째인지.
function stamp(){
  const a = document.getElementById('alive'), s = document.getElementById('stamp');
  if (!okAt){ a.className = 'stale'; s.textContent = '아직 못 받음'; return; }
  const age = Date.now() - okAt, t = new Date(okAt).toTimeString().slice(0, 8);
  const stale = age > STALE;
  a.className = stale ? 'stale' : '';
  s.textContent = stale ? `${Math.floor(age/60000)}분째 갱신 안 됨 (${t})` : `${t} 갱신`;
}
setInterval(stamp, 5000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); else clearTimeout(timer); });

// ── 분배금 공지판 ── PC 위젯과 같은 규칙(tools/ticker.pyw 의 board_of 설명 참고).
//   월중 │ K T A P R S H KW   공지가 뜬 회사 칸에 불, 지급일이 지나면 꺼짐, 새로 켜진 칸은 누를 때까지 깜박임
//   월말 │ …
//   09.28 KODEX 9월 월말배당    가장 최근 공지 한 줄
// 출처: 같은 사이트의 공개 예비본 dist_snapshot.txt(포트폴리오의 새 공지 카톡과 같은 출처).
const ISSUER = {kodex:'KODEX',tiger:'TIGER',ace:'ACE',plus:'PLUS',rise:'RISE',sol:'SOL',hanaro:'HANARO',kiwoom:'KIWOOM'};
const CHIP = {kodex:'K',tiger:'T',ace:'A',plus:'P',rise:'R',sol:'S',hanaro:'H',kiwoom:'KW'};
const CYCLES = ['월중','월말'];
const CHIP_COLOR = {kodex:'#2563eb',tiger:'#f59e0b',ace:'#059669',plus:'#7c3aed',rise:'#dc2626',sol:'#0891b2',hanaro:'#65a30d',kiwoom:'#db2777'};
function kstToday(){ const d = new Date(Date.now() + 9*3600e3); return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); }
function mdDate(s, today){
  const m = String(s || '').match(/(\d{1,2})\s*[월/.]\s*(\d{1,2})/); if (!m) return null;
  let best = null;
  for (const y of [today.getUTCFullYear()-1, today.getUTCFullYear(), today.getUTCFullYear()+1]){
    const c = new Date(Date.UTC(y, +m[1]-1, +m[2]));
    if (c.getUTCMonth() !== +m[1]-1) continue;
    if (!best || Math.abs(c - today) < Math.abs(best - today)) best = c;
  }
  return best;
}
const ymd = d => d.toISOString().slice(0, 10);
function boardOf(j, today){
  const out = {};
  Object.keys(ISSUER).forEach(k => {
    const v = (j.dist || {})[k] || {}; if (v.success === false) return;
    const nts = (((j.notices || {})[k] || {}).items) || [];
    (v.items || []).forEach(it => {
      const cyc = it.cycle, sc = it.sched || {}, id = k + '|' + cyc;
      if (!CYCLES.includes(cyc) || out[id]) return;
      const pub = mdDate(sc['공시일'], today), pay = mdDate(sc['지급일'], today), base = mdDate(sc['기준일'], today);
      if (!pay) return;
      const ds = pub ? ymd(pub).replace(/-/g, '.') : '';
      const hit = nts.find(n => n.date === ds) || nts[0] || {};
      out[id] = {k, cyc, pub, pay, base, url: hit.url || '', key: `${k}|${cyc}|${ymd(pay)}`,
                 lit: (!pub || pub <= today) && today <= pay};
    });
  });
  return out;
}
let board = {};
function drawBoard(stale){
  const N = document.getElementById('notice');
  let seen = store.get('tk_seen2', null);
  if (!seen){ seen = Object.values(board).filter(b => b.lit).map(b => b.key); store.set('tk_seen2', seen); }
  N.innerHTML = '';
  CYCLES.forEach(c => {
    const row = document.createElement('div'); row.className = 'brow';
    const any = Object.values(board).some(b => b.cyc === c && b.lit);
    row.innerHTML = `<span class="cy${any ? ' on' : ''}">${c}</span><div class="chips"></div>`;
    const grid = row.querySelector('.chips');
    Object.entries(ISSUER).forEach(([k, t]) => {
      const b = board[k + '|' + c], ch = document.createElement('span');
      ch.className = 'chip' + (b && b.lit ? ' lit' + (seen.includes(b.key) ? '' : ' new') : '');
      ch.textContent = t; ch.title = ISSUER[k]; ch.style.setProperty('--c', CHIP_COLOR[k]);
      ch.onclick = () => { if (!b || !b.lit) return;
        seen = [b.key, ...seen.filter(x => x !== b.key)].slice(0, 100); store.set('tk_seen2', seen);
        ch.classList.remove('new'); if (b.url) window.open(b.url, '_blank', 'noopener'); };
      grid.appendChild(ch);
    });
    N.appendChild(row);
  });
  const t = kstToday();
  const pool = Object.values(board).filter(b => (b.pub || b.pay) <= t);
  const line = document.createElement('div'); line.id = 'bline';
  if (pool.length){
    const lit = pool.filter(b => b.lit), pick = (lit.length ? lit : pool)
      .sort((a, b) => ((b.pub||b.pay) - (a.pub||a.pay)) || b.k.localeCompare(a.k))[0];
    const p = pick.pub || pick.pay;
    line.textContent = `${ymd(p).slice(5).replace('-', '.')} ${ISSUER[pick.k]} ${(pick.base || pick.pay).getUTCMonth()+1}월 ${pick.cyc}배당` + (stale ? ' · 못 받음' : '');
    if (lit.length) line.className = 'on';
  } else line.textContent = stale ? '공지: 못 받음' : '';
  N.appendChild(line);
}
async function loadNotices(){
  try{
    const j = await (await fetch('dist_snapshot.txt', {cache:'no-store'})).json();
    board = boardOf(j, kstToday()); drawBoard(false);
  }catch(e){ drawBoard(true); }
}
loadNotices(); setInterval(loadNotices, 600000);

// ── 편집 ──
const ta = document.getElementById('ta'), ed = document.getElementById('edit');
document.getElementById('editBtn').onclick = () => { ta.value = tickers.join('\n'); ed.style.display = ed.style.display === 'block' ? 'none' : 'block'; };
document.getElementById('cancelBtn').onclick = () => { ed.style.display = 'none'; };
document.getElementById('resetBtn').onclick = () => { ta.value = DEFAULT.join('\n'); };
function done(n){
  ed.style.display = 'none'; build(); load();
  document.getElementById('hint').textContent = `목록 ${n}종목으로 맞췄습니다`;
}
document.getElementById('saveBtn').onclick = async () => {
  const code = codeOf(ta.value);           // 8글자 코드(또는 #k= 링크)만 적었으면 중계에서 받는다
  if (code && ta.value.trim().split('\n').length === 1){ const n = await useCode(code); if (n) done(n); return; }
  const arr = decodeImport(ta.value);      // 옛 긴 링크를 통째로 붙여넣어도 된다
  store.set('tk_code', null);              // 손으로 고친 목록은 집 목록을 따라가지 않는다
  done(applyList(arr || ta.value.split('\n').map(x => x.trim()).filter(Boolean)));
};
// 복사해 둔 가져오기 링크를 한 번에 넣는다(클립보드 읽기 — 처음 한 번 허용을 묻는다).
document.getElementById('pasteBtn').onclick = async () => {
  try{
    const t = await navigator.clipboard.readText();
    const code = codeOf(t);
    if (code){ const n = await useCode(code); if (n) done(n); return; }
    const arr = decodeImport(t);
    if (arr) return done(applyList(arr));
    ta.value = t;                           // 링크가 아니면 칸에 넣어 주고 저장은 사람이 누른다
  }catch(e){ ta.focus(); alert('붙여넣기 권한이 없어요. 칸을 길게 눌러 붙여넣은 뒤 저장을 누르세요.'); }
};

// ── 총평가 한 줄 ── 대시보드 '평가금'과 같은 식(보유 수량 × 대시보드가 쓰는 현재가)을 중계가 계산해 준다.
// 오늘 등락 = 지금 − 전일 기준. 예수금(현금)은 빠진다(대시보드 '총자산' = 평가금 + 예수금).
// 금액이라 목록 코드(tk_code)가 있을 때만 받는다. 2분마다.
const eok = v => (v / 1e8).toFixed(2) + '억';
async function loadTotal(){
  const code = store.get('tk_code', null), T = document.getElementById('total');
  if (!code){ T.style.display = 'none'; return; }
  try{
    const j = await (await fetch(RELAY + '?total=' + encodeURIComponent(code), {cache:'no-store'})).json();
    const t = j.total; if (!t || !t.value) throw 0;
    const [nm, px, ch, amt, bd] = T.children;
    T.style.display = '';
    px.textContent = eok(t.value);
    ch.textContent = (t.pct >= 0 ? '+' : '') + t.pct.toFixed(2) + '%';
    ch.className = 'ch ' + (t.diff > 0 ? 'up' : t.diff < 0 ? 'down' : 'dim');
    amt.textContent = (t.diff > 0 ? '+' : '') + Math.round(t.diff).toLocaleString('ko-KR');
    amt.className = 'amt ' + (t.diff > 0 ? 'up' : t.diff < 0 ? 'down' : 'dim');
    const part = t.noPrev ? ` · 등락 ${t.n - t.noPrev}/${t.n}종목` : '';
    bd.textContent = `오늘 ${t.diff > 0 ? '+' : ''}${Math.round(t.diff).toLocaleString('ko-KR')}원 · ${t.at} 기준${part}`;
    bd.className = 'band';
  }catch(e){
    if (T.style.display !== 'none') T.lastElementChild.textContent = '총평가: 못 받음(직전 값)';
  }
}
loadTotal(); setInterval(() => { if (document.visibilityState === 'visible') loadTotal(); }, 120000);

build(); load();
if (imported) document.getElementById('hint').textContent = `집 PC 목록 ${imported}종목으로 맞췄습니다`;
</script>
